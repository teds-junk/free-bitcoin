<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Beaten on both counts</title>

  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:300px}.terms .title{font-size:46px}.terms .label{font-size:36px;line-height:1.35}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Cost per passing trial</div>
  <h2 class="scene-title">Beaten on both counts</h2>
  <div class="stage">
<div class="cols wide terms">

      <div class="title words">Beaten on both counts</div><div class="label">costs more, and passes no more often: it can be dropped</div>
    </div>
    <div class="semantic-block" data-concept="choice" data-rep="block" data-role="attention">
      <div class="title words">A real choice</div><div class="label">costs more, and passes more often: it depends on what a failure costs you</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "beaten",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "choice",
  "at": "3",
  "color": "yellow"
 }
]
</script>

</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Small, and it grows</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.stage{gap:28px}.stage > .semantic-block{width:100%}.stage > .semantic-block .title{font-size:46px}.stage > .semantic-block .label{font-size:34px}.four .semantic-block{min-height:150px;justify-content:center}.four .label{display:none}.lead.with{font-size:34px;margin:0}.four .title{font-size:38px}.lead{font-size:38px;margin:0}.stage{gap:22px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What the table says</div>
  <h2 class="scene-title">Small, and it grows</h2>
  <div class="stage">
<div class="semantic-block" data-concept="course" data-rep="block" data-role="structure">
      <div class="title words">About $11 of agent runs, plus judge calls</div><div class="label">what verifying this course took</div>
    </div>
  <p class="lead with">It grows with</p>
  <div class="cols four">
    <div class="semantic-block" data-concept="g1" data-rep="block" data-role="attention">
      <div class="title words">stimuli</div><div class="label"></div>
    </div><div class="semantic-block" data-concept="g2" data-rep="block" data-role="attention">
      <div class="title words">trials</div><div class="label"></div>
    </div><div class="semantic-block" data-concept="g3" data-rep="block" data-role="attention">
      <div class="title words">models</div><div class="label"></div>
    </div><div class="semantic-block" data-concept="g4" data-rep="block" data-role="attention">
      <div class="title words">how often you run</div><div class="label"></div>
    </div>
  </div>
  <p class="lead"><span data-concept="allow" data-rep="note">Your plan’s monthly allowance is spent first.</span></p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "course",
  "at": "0",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "g1",
  "at": "1~stimuli",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "g2",

  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "g3",
  "at": "1~models",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "g4",
  "at": "1~how often",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "allow",
  "at": "2",
  "color": "blue"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Error is not a failure</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.rows{display:flex;flex-direction:column;gap:26px;width:100%}.trow{display:flex;align-items:center;gap:36px;padding:14px 22px;border-radius:10px;width:fit-content}.boxes{display:flex;gap:14px}.box{display:flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:8px;border:3px solid var(--ink-muted);font:700 44px/1 var(--font-body);color:var(--ink)}.box.tick{color:var(--green-ink)}.box.cross{color:var(--red-ink)}.box.dash{color:var(--ink-muted)}.box.empty{border-color:var(--rule)}.trow .word{font:600 44px/1 var(--font-code);color:var(--ink);min-width:190px}.trow .mean{font:400 36px/1.3 var(--font-body);color:var(--ink-soft)}.trow .who{font:500 34px/1 var(--font-code);color:var(--ink);min-width:400px}.big .box{width:120px;height:120px;font-size:64px}.big .boxes{gap:22px}.big .word{font-size:60px}.lead{font-size:42px;margin:0}.stage{gap:44px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Five trials, four outcomes</div>
  <h2 class="scene-title">Error is not a failure</h2>
  <div class="stage">
<div class="rows big">
    <div class="trow" data-concept="w-error" data-rep="row">
      <span class="boxes"><span class="box tick">✔</span><span class="box dash" data-concept="gone" data-rep="box">–</span><span class="box tick">✔</span><span class="box dash" data-concept="gone" data-rep="box">–</span><span class="box tick">✔</span></span><span class="word">ERROR</span>
    </div>
  </div>
  <p class="lead"><span data-concept="noanswer" data-rep="note">A trial that didn’t finish gave no answer to judge.</span></p>
  <p class="lead"><span data-concept="again" data-rep="note">We run it again, or leave the trial out and say so.</span></p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "gone",
  "at": "1~no answer",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "noanswer",
  "at": "1~connection",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "again",
  "at": "2",
  "color": "blue"
 }
]
</script>
</body>
</html>

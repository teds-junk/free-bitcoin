<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Once can’t say how often</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Does it happen every time?</div>
  <h2 class="scene-title">Once can’t say how often</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="can" data-rep="block" data-role="structure">
      <div class="title words">Can this happen?</div><div class="label">one trial answers it</div>
    </div>
    <div class="semantic-block" data-concept="often" data-rep="block" data-role="attention">
      <div class="title words">How often?</div><div class="label">needs several trials of the same stimulus</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "can",
  "at": "0~one time",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "often",
  "at": "2~how often",
  "color": "yellow"
 }
]
</script>
</body>
</html>

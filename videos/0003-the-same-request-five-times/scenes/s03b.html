<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Identical runs, different scores</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Does it happen every time?</div>
  <h2 class="scene-title">Identical runs, different scores</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="same" data-rep="block" data-role="structure">
      <div class="title words">Same agent, same tasks</div><div class="label">run several times</div>
    </div>
    <div class="semantic-block" data-concept="moved" data-rep="block" data-role="attention">
      <div class="title words">2 to 6 percentage points</div><div class="label">how far its score moved between runs</div>
    </div>
  </div>
  <p class="note">Source: a 2026 preprint from KTH · one benchmark · not yet peer reviewed</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "same",
  "at": "1~same agent",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "moved",
  "at": "2~two to six",
  "color": "yellow"
 }
]
</script>
</body>
</html>

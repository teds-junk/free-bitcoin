<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>One trial is one sample</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.rows{display:flex;flex-direction:column;gap:26px;width:100%}.trow{display:flex;align-items:center;gap:36px;padding:14px 22px;border-radius:10px;width:fit-content}.boxes{display:flex;gap:14px}.box{display:flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:8px;border:3px solid var(--ink-muted);font:700 44px/1 var(--font-body);color:var(--ink)}.box.tick{color:var(--green-ink)}.box.cross{color:var(--red-ink)}.box.dash{color:var(--ink-muted)}.box.empty{border-color:var(--rule)}.trow .word{font:600 44px/1 var(--font-code);color:var(--ink);min-width:190px}.trow .mean{font:400 36px/1.3 var(--font-body);color:var(--ink-soft)}.trow .who{font:500 34px/1 var(--font-code);color:var(--ink);min-width:400px}.box.wide{width:226px;height:110px;font:500 32px/1 var(--font-code)}.trow.head{padding-top:0;padding-bottom:0}.num{width:226px;text-align:center;font:500 30px/1 var(--font-code);color:var(--ink-muted)}.trow .who{min-width:380px}.rows{gap:18px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Does it happen every time?</div>
  <h2 class="scene-title">One trial is one sample</h2>
  <div class="stage">
<div class="rows">
    <div class="trow head"><span class="who"></span><span class="boxes"><span class="num">0</span><span class="num">1</span><span class="num">2</span><span class="num">3</span><span class="num">4</span></span></div>
    <div class="trow"><span class="who">claude-haiku-4.5</span><span class="boxes"><span class="box wide seen" data-concept="seen" data-rep="box">no number</span><span class="box wide empty" data-concept="rest" data-rep="box"></span><span class="box wide empty" data-concept="rest" data-rep="box"></span><span class="box wide empty" data-concept="rest" data-rep="box"></span><span class="box wide empty" data-concept="rest" data-rep="box"></span></span></div>
    <div class="trow"><span class="who">gpt-5.6-terra</span><span class="boxes"><span class="box wide seen" data-concept="seen" data-rep="box">(#42)</span><span class="box wide empty" data-concept="rest" data-rep="box"></span><span class="box wide empty" data-concept="rest" data-rep="box"></span><span class="box wide empty" data-concept="rest" data-rep="box"></span><span class="box wide empty" data-concept="rest" data-rep="box"></span></span></div>
  </div>
  <p class="note">trial 0 is the one we have seen · trials 1 to 4 have not been run</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "seen",
  "at": "0~once",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "rest",
  "at": "2~varies",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "seen",
  "at": "4~single trial",
  "color": "blue"
 }
]
</script>
</body>
</html>

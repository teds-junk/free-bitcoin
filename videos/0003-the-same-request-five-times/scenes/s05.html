<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Four words for a stimulus</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.rows{display:flex;flex-direction:column;gap:26px;width:100%}.trow{display:flex;align-items:center;gap:36px;padding:14px 22px;border-radius:10px;width:fit-content}.boxes{display:flex;gap:14px}.box{display:flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:8px;border:3px solid var(--ink-muted);font:700 44px/1 var(--font-body);color:var(--ink)}.box.tick{color:var(--green-ink)}.box.cross{color:var(--red-ink)}.box.dash{color:var(--ink-muted)}.box.empty{border-color:var(--rule)}.trow .word{font:600 44px/1 var(--font-code);color:var(--ink);min-width:190px}.trow .mean{font:400 36px/1.3 var(--font-body);color:var(--ink-soft)}.trow .who{font:500 34px/1 var(--font-code);color:var(--ink);min-width:400px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Five trials, four outcomes</div>
  <h2 class="scene-title">Four words for a stimulus</h2>
  <div class="stage">
<div class="rows">
    <div class="trow" data-concept="w-pass" data-rep="row">
      <span class="boxes"><span class="box tick">✔</span><span class="box tick">✔</span><span class="box tick">✔</span><span class="box tick">✔</span><span class="box tick">✔</span></span><span class="word">PASS</span><span class="mean">every trial passed</span>
    </div><div class="trow" data-concept="w-flaky" data-rep="row">
      <span class="boxes"><span class="box cross">✘</span><span class="box tick">✔</span><span class="box tick">✔</span><span class="box tick">✔</span><span class="box tick">✔</span></span><span class="word">FLAKY</span><span class="mean">some passed, some failed</span>
    </div><div class="trow" data-concept="w-fail" data-rep="row">
      <span class="boxes"><span class="box cross">✘</span><span class="box cross">✘</span><span class="box cross">✘</span><span class="box cross">✘</span><span class="box cross">✘</span></span><span class="word">FAIL</span><span class="mean">no trial passed</span>
    </div><div class="trow" data-concept="w-error" data-rep="row">
      <span class="boxes"><span class="box tick">✔</span><span class="box dash">–</span><span class="box tick">✔</span><span class="box dash">–</span><span class="box tick">✔</span></span><span class="word">ERROR</span><span class="mean">a trial didn’t finish: no verdict</span>
    </div>
  </div>
  <p class="note">An illustration: five trials of one stimulus on one model</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "w-pass",
  "at": "2",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "w-flaky",
  "at": "3",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "w-fail",
  "at": "4",
  "color": "red"
 },
 {
  "type": "focus",
  "target": "w-error",
  "at": "5",
  "color": "blue"
 }
]
</script>
</body>
</html>

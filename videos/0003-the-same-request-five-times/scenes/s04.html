<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Five trials, five folders</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.code.dark.tree{min-width:900px;font-size:38px;line-height:1.7}.callout{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Five trials, four outcomes</div>
  <h2 class="scene-title">Five trials, five folders</h2>
  <div class="stage">
<div class="annotated">
    <pre class="code dark tree" data-lang="text"><code><span>vally eval … </span><span data-concept="runs" data-rep="code"><span>--runs 5</span></span>
<span data-concept="ev" data-rep="code"><span>one-request/</span></span>
<span>  </span><span data-concept="stim" data-rep="code"><span>typo-fix/</span></span>
<span>    </span><span data-concept="model" data-rep="code"><span>gpt-5.6-terra/</span></span>
<span>      </span><span data-concept="nums" data-rep="code"><span>0/  1/  2/  3/  4/</span></span>
<span>        </span><span data-concept="patch" data-rep="code"><span>workspace.patch</span></span></code></pre>
    <aside class="callouts"><p class="callout" data-anchor="runs">every stimulus, five times</p><p class="callout" data-anchor="ev">the eval</p><p class="callout" data-anchor="stim">the stimulus</p><p class="callout" data-anchor="model">one of the models</p><p class="callout" data-anchor="nums">one folder per trial</p><p class="callout" data-anchor="patch">each with its own patch</p></aside>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "runs",
  "at": "1~runs five",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "nums",
  "at": "3~numbered",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "patch",
  "at": "3~patch",
  "color": "orange"
 },
 {
  "type": "focus",
  "target": "stim",
  "at": "4~one stimulus",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "model",
  "at": "4~two models",
  "color": "blue"
 }
]
</script>
</body>
</html>

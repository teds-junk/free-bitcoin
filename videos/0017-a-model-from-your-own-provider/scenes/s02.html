<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Same name, different behavior</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .title{font-size:40px}.terms .label{font-size:34px}.stage{gap:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Evaluate the model you ship</div>
  <h2 class="scene-title">Same name, different behavior</h2>
  <div class="stage">
<div class="cols terms">
    <div class="semantic-block" data-concept="stored" data-rep="block" data-role="structure">
      <div class="title words">How it is stored</div><div class="label">often compressed to fit smaller machines</div>
    </div>
    <div class="semantic-block" data-concept="calls" data-rep="block" data-role="transform">
      <div class="title words">How tool calls become text</div><div class="label">what the model actually sees</div>
    </div>
    <div class="semantic-block" data-concept="defaults" data-rep="block" data-role="attention">
      <div class="title words">Its default settings</div><div class="label">chosen by whoever serves it</div>
    </div>
  </div>
  <p class="note">The copy we run here is a 4-bit compressed version.</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "stored",
  "at": "3~stored",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "calls",
  "at": "4~tool calls",
  "color": "cyan"
 },
 {
  "type": "focus",
  "target": "defaults",
  "at": "5~default",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "6"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A price for the arithmetic</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.price{font-size:48px}.price th{font-size:30px}.price td{padding-top:26px;padding-bottom:26px}.stage{gap:30px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">A variant on a local model</div>
  <h2 class="scene-title">A price for the arithmetic</h2>
  <div class="stage">
<table class="data-table price">
    <thead><tr><th></th><th class="num">per million tokens</th></tr></thead>
    <tbody>
      <tr><td>input tokens</td><td class="num"><span data-concept="pin" data-rep="cell">$0.10</span></td></tr>
      <tr><td>output tokens</td><td class="num"><span data-concept="pout" data-rep="cell">$0.40</span></td></tr>
    </tbody>
  </table>
  <p class="note">Made up for the arithmetic · not any provider’s price</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "pin",
  "at": "1~ten cents",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "pout",
  "at": "1~forty cents",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "2"
 }
]
</script>
</body>
</html>

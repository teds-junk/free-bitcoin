<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Skills often go unused</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}.terms [data-concept="unused"] .title{font-size:110px;line-height:1.1}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">The description decides</div>
  <h2 class="scene-title">Skills often go unused</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="meant" data-rep="block" data-role="structure">
      <div class="title words">A skill, in the cases it was meant for</div><div class="label">one vendor’s report</div>
    </div>
    <div class="semantic-block" data-concept="unused" data-rep="block" data-role="attention">
      <div class="title">56%</div><div class="label">of those cases: the skill went unused</div>
    </div>
  </div>
  <p class="note">Source: Vercel, 2026 · the vendor’s own figure · run counts not published</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "meant",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "unused",
  "at": "1~fifty-six",
  "color": "yellow"
 }
]
</script>
</body>
</html>

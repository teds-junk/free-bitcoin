<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A description says three things</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:300px;justify-content:center}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">The description decides</div>
  <h2 class="scene-title">A description says three things</h2>
  <div class="stage">
<div class="cols terms">
    <div class="semantic-block" data-concept="does" data-rep="block" data-role="structure">
      <div class="title words">What the skill does</div>
    </div>
    <div class="semantic-block" data-concept="when" data-rep="block" data-role="structure">
      <div class="title words">When to use it</div><div class="label">as a situation, not a word to look for</div>
    </div>
    <div class="semantic-block" data-concept="notfor" data-rep="block" data-role="structure">
      <div class="title words">What it is not for</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "does",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "when",
  "at": "2",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "notfor",

 }

</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The report’s Skills column</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.rep{font-size:40px}.rep th{font-size:32px}.rep td{padding-top:36px;padding-bottom:36px}.rep td.mono{font-family:var(--font-code);font-size:36px}.rep caption{font-size:30px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">How a trial records loading</div>
  <h2 class="scene-title">The report’s Skills column</h2>
  <div class="stage">
<table class="data-table full rep">
    <thead><tr><th>Model</th><th>Stimulus</th><th><span data-concept="skills-head" data-rep="head">Skills</span></th><th class="num">Pass Rate</th></tr></thead>
    <tbody>
<tr><td class="mono">claude-haiku-4.5</td><td class="mono">typo-fix</td><td class="mono"><span data-concept="sk" data-rep="cell">changelog-entry (5×)</span></td><td class="num">5/5</td></tr>
<tr><td class="mono">gpt-5.6-terra</td><td class="mono">typo-fix</td><td class="mono"><span data-concept="sk" data-rep="cell">changelog-entry (5×)</span></td><td class="num">5/5</td></tr>
    </tbody>
    <caption><span class="mono">eval-results.md</span> · three of its twelve columns · our five-trial run</caption>
  </table>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "skills-head",
  "at": "1~Skills",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "sk",
  "at": "3~five times",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "4"
 }
]
</script>
</body>
</html>

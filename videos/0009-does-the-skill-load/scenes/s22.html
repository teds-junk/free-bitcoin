<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The test is what we keep</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}.terms .semantic-block{justify-content:center}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What the loading test showed</div>
  <h2 class="scene-title">The test is what we keep</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="sample" data-rep="block" data-role="attention">
      <div class="title words">2 of 2, then 1 of 2</div><div class="label">one stimulus on one model: a small sample</div>
    </div>
    <div class="semantic-block" data-concept="keep" data-rep="block" data-role="structure">
      <div class="title words">The loading test</div><div class="label">one command shows whether the boundary moved</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "sample",
  "at": "0",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "keep",
  "at": "1",
  "color": "blue"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>This one can’t be re-graded</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:290px}.terms .title{font-size:52px}.terms .label{font-size:34px;line-height:1.35}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">A hidden test</div>
  <h2 class="scene-title">This one can’t be re-graded</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="patchy" data-rep="block" data-role="success">
      <div class="title words">Reads the patch or the trajectory</div><div class="label">can be re-graded from saved trials</div>
    </div>
    <div class="semantic-block" data-concept="needs" data-rep="block" data-role="attention">
      <div class="title words">Needs the finished workspace</div><div class="label">cannot: Vally doesn’t keep it</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "needs",
  "at": "0~needs",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "patchy",
  "at": "1~patch",
  "color": "green"
 }
]
</script>
</body>
</html>

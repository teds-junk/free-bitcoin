<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Commands run before the agent</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.order{display:grid;gap:22px 26px;width:100%}.order .semantic-block{min-height:250px}.order .title{font-size:46px;line-height:1.15}.order .label{font-size:32px;line-height:1.3}.order .span{border-top:4px solid var(--ink-muted);padding-top:16px;text-align:center;font:500 36px/1.2 var(--font-body);color:var(--ink)}.order .span span{padding:4px 14px;border-radius:8px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Set up before the agent starts</div>
  <h2 class="scene-title">Commands run before the agent</h2>
  <div class="stage">
<div class="order" style="grid-template-columns:repeat(3,1fr)"><div class="semantic-block" data-concept="b1" data-rep="block" data-role="structure">
      <div class="step">1</div><div class="title words">Stage</div><div class="label">the files and the skill</div>
    </div><div class="semantic-block" data-concept="b2" data-rep="block" data-role="transform">
      <div class="step">2</div><div class="title words">Run commands</div><div class="label">in the workspace, in order</div>
    </div><div class="semantic-block" data-concept="b3" data-rep="block" data-role="attention">
      <div class="step">3</div><div class="title words">Agent works</div><div class="label">on the app’s prompt</div>
    </div><div class="span" style="grid-column:span 2"><span data-concept="start" data-rep="note">the starting state</span></div><div class="span" style="grid-column:span 1"><span data-concept="inpatch" data-rep="note">in the patch</span></div></div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "b2",
  "at": "2~runs them",
  "color": "cyan"
 },
 {
  "type": "focus",
  "target": "start",
  "at": "5~starting state",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "inpatch",
  "at": "6",
  "color": "green"
 }
]
</script>
</body>
</html>

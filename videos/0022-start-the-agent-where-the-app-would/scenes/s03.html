<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Run the app’s own setup</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:290px}.terms .title{font-size:52px}.terms .label{font-size:34px;line-height:1.35}.lead{font-size:42px}.stage{gap:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">An app starts the agent</div>
  <h2 class="scene-title">Run the app’s own setup</h2>
  <div class="stage">
<p class="lead">Next month, the team changes the list’s format.</p>
  <div class="cols wide terms">
    <div class="semantic-block" data-concept="runs" data-rep="block" data-role="success">
      <div class="title words">An eval that runs their tool</div><div class="label">sees the new format</div>
    </div>
    <div class="semantic-block" data-concept="copy" data-rep="block" data-role="attention">
      <div class="title words">A hand-written copy of the list</div><div class="label">keeps passing, and tells you nothing</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "runs",
  "at": "3",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "copy",
  "at": "4",
  "color": "yellow"
 }
]
</script>
</body>
</html>

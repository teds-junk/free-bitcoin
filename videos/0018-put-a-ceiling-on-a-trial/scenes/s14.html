<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What a typical trial used</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.stats .semantic-block{min-height:300px;justify-content:center}.stats .title{font-size:84px;line-height:1.1}.stats .label{font-size:32px}.stats .label{line-height:1.5}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Set budgets from your runs</div>
  <h2 class="scene-title">What a typical trial used</h2>
  <div class="stage">
<div class="cols terms stats">
    <div class="semantic-block" data-concept="tok" data-rep="block" data-role="structure">
      <div class="title">106,316</div><div class="label">tokens · <span class="mono">haiku-high · two-changes</span></div>
    </div>
    <div class="semantic-block" data-concept="turns" data-rep="block" data-role="structure">
      <div class="title">5</div><div class="label">turns · <span class="mono">haiku-high · after-release</span></div>
    </div>
    <div class="semantic-block" data-concept="secs" data-rep="block" data-role="structure">
      <div class="title">12.9 s</div><div class="label">duration · <span class="mono">terra-low · security</span></div>
    </div>
  </div>
  <p class="note">the largest median in each column of <span class="mono">report.md</span>, across the four variants · our run 2026-11-11T08-39-02-179Z</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "tok",
  "at": "2~tokens",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "turns",
  "at": "2~turns",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "secs",
  "at": "2~seconds",
  "color": "yellow"
 }
]
</script>
</body>
</html>

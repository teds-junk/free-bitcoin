<!doctype html>
<html lang="en">
<head>

</head>
<body>
<main class="scene ">
  <div class="eyebrow">A budget is a grader</div>
  <h2 class="scene-title">Two kinds of trouble</h2>

      <div class="title words">a loop</div><div class="label">one trial gone wrong</div>

      <div class="title words">a cost regression</div><div class="label">an edit makes every trial read more, or take longer</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[

  "at": "1",

 },
 {
  "type": "focus",
  "target": "reg",
  "at": "2",

 },
 {
  "type": "focus",
  "target": "none",

</html>

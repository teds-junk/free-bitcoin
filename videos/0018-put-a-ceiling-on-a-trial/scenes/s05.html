<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Not too much, and right</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:260px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">A budget is a grader</div>
  <h2 class="scene-title">Not too much, and right</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="b-says" data-rep="block" data-role="attention">
      <div class="title words">“not too much”</div><div class="label">a budget says</div>
    </div>
    <div class="semantic-block" data-concept="g-say" data-rep="block" data-role="success">
      <div class="title words">“and it was right”</div><div class="label">only the other graders say</div>
    </div>
  </div>
  <p class="note">a trial that gives up after one turn is inside every budget</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "b-says",
  "at": "2~not too much",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "g-say",
  "at": "2~other graders",
  "color": "green"
 }
]
</script>
</body>
</html>

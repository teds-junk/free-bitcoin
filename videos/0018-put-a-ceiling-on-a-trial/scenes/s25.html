<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Typical is a middle value</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.stats .semantic-block{min-height:300px;justify-content:center}.stats .title{font-size:96px;line-height:1.1}.stats .label{font-size:32px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What the limits caught</div>
  <h2 class="scene-title">Typical is a middle value</h2>
  <div class="stage">
<div class="cols wide terms stats">
    <div class="semantic-block" data-concept="five" data-rep="block" data-role="attention">
      <div class="title">3 of 30</div><div class="label">good trials the first budgets failed</div>
    </div>
    <div class="semantic-block" data-concept="spread" data-rep="block" data-role="structure">
      <div class="title">4, 5 or 6</div><div class="label">turns <span class="mono">terra-high</span> took for the same request</div>
    </div>
  </div>
  <p class="note">a typical trial is the median: half of all trials are above it</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "five",
  "at": "1",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "3"
 },
 {
  "type": "focus",
  "target": "spread",
  "at": "4",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "5"
 }
]
</script>
</body>
</html>

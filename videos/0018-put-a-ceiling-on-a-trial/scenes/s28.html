<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A limit for the bad day</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.stats .semantic-block{min-height:300px;justify-content:center}.stats .title{font-size:96px;line-height:1.1}.stats .label{font-size:32px}.stats .label{line-height:1.5}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What the limits caught</div>
  <h2 class="scene-title">A limit for the bad day</h2>
  <div class="stage">
<div class="cols wide terms stats">
    <div class="semantic-block" data-concept="lim" data-rep="block" data-role="success">
      <div class="title">1m</div><div class="label"><span class="mono">max_agent_duration</span> · stop the agent, grade what it wrote</div>
    </div>
    <div class="semantic-block" data-concept="to" data-rep="block" data-role="structure">
      <div class="title">3m</div><div class="label">the file’s <span class="mono">timeout</span></div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "lim",
  "at": "0",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "to",
  "at": "2~timeout",
  "color": "blue"
 }
]
</script>
</body>
</html>

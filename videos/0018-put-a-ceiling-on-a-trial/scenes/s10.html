<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Over is over</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:260px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Budget graders</div>
  <h2 class="scene-title">Over is over</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="score" data-rep="block" data-role="structure">
      <div class="title words">the score</div><div class="label">falls in proportion to the overrun</div>
    </div>
    <div class="semantic-block" data-concept="verdict" data-rep="block" data-role="failure">
      <div class="title words">the verdict</div><div class="label">fails, however small the overrun</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "score",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "verdict",
  "at": "2",
  "color": "red"
 }
]
</script>
</body>
</html>

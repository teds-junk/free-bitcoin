<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Budgets just above typical</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.cmp{font-size:50px}.cmp th{font-size:28px}.cmp td{padding-top:24px;padding-bottom:24px}.cmp td:first-child{font-size:36px}.cmp th:last-child,.cmp td:last-child{padding-right:16px}</style>

<body>
<main class="scene ">
  <div class="eyebrow">Set budgets from your runs</div>

<table class="data-table full cmp"><thead><tr><th></th><th class=num>largest typical</th><th class=num>first budget</th></tr></thead><tbody><tr><td>tokens</td><td class="num">106,316</td><td class="num"><span data-concept="b-tokens" data-rep="cell"><span class="mono">107000</span></span></td></tr><tr><td>turns</td><td class="num">5</td><td class="num"><span data-concept="b-turns" data-rep="cell"><span class="mono">5</span></span></td></tr><tr><td>time</td><td class="num">12.9 s</td><td class="num"><span data-concept="b-time" data-rep="cell"><span class="mono">13s</span></span></td></tr></tbody></table>
  <p class="note"><span class="mono">max</span> of <span class="mono">token-budget</span>, <span class="mono">turn-count</span> and <span class="mono">wall-time</span>, under each of the five stimuli</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "b-tokens",
  "at": "1~tokens",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "b-turns",
  "at": "1~turns",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "b-time",

  "color": "yellow"
 }
]

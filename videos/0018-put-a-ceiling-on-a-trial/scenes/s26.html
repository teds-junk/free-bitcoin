<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Room above normal</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:260px}.terms .label{font-size:34px}.terms .label{font-size:44px}.stage{gap:30px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What the limits caught</div>
  <h2 class="scene-title">Room above normal</h2>
  <div class="stage">
<p class="lead">a budget at about twice the largest typical trial</p>
  <div class="cols wide terms">
    <div class="semantic-block" data-concept="runaway" data-rep="block" data-role="failure">
      <div class="title words">a loop, at ten times the usual</div><div class="label">fails</div>
    </div>
    <div class="semantic-block" data-concept="onemore" data-rep="block" data-role="success">
      <div class="title words">one turn more than usual</div><div class="label">passes</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "runaway",
  "at": "1",
  "color": "red"
 },
 {
  "type": "focus",
  "target": "onemore",
  "at": "2",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "3"
 }
]
</script>
</body>
</html>

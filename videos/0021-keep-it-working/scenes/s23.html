<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A cheaper model, checked first</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.two .semantic-block{min-height:210px;justify-content:center}.two .title{font-size:56px}.two .label{font-size:32px}.three{gap:24px}.three .semantic-block{min-height:150px;flex-direction:row;align-items:center;gap:24px}.three .title{font-size:52px}.three .label{font-size:32px}.stage{gap:28px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Where the skill stands</div>
  <h2 class="scene-title">A cheaper model, checked first</h2>
  <div class="stage">
<div class="cols wide two">
    <div class="semantic-block" data-concept="ours" data-rep="block" data-role="structure">
      <div class="title">about 24 AIU an edit</div><div class="label">the quick suite on our two models</div>
    </div>
    <div class="semantic-block" data-concept="cheap" data-rep="block" data-role="success">
      <div class="title">about 1 AIU an edit</div><div class="label"><span class="mono">claude-haiku-5.5</span>, low effort · passed 15 of 15 earlier</div>
    </div>
  </div>
  <div class="cols three">
    <div class="semantic-block" data-concept="m1" data-rep="block" data-role="structure">
      <div class="title">1</div><div class="label">compare cost per passing trial</div>
    </div>
    <div class="semantic-block" data-concept="m2" data-rep="block" data-role="structure">
      <div class="title">2</div><div class="label">re-test the budgets on its saved trials</div>
    </div>
    <div class="semantic-block" data-concept="m3" data-rep="block" data-role="structure">
      <div class="title">3</div><div class="label">run the full suite on it first</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "ours",
  "at": "0",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "cheap",
  "at": "1",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "m1",
  "at": "3~compare",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "m2",
  "at": "3~re-test",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "m3",
  "at": "3~run the full",
  "color": "yellow"
 }
]
</script>
</body>
</html>

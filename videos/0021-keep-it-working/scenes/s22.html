<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What the routine costs</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.data-table{font-size:38px}.data-table th{font-size:30px}.data-table td{padding-top:24px;padding-bottom:24px}.data-table td.mono,.data-table th.mono{font-family:var(--font-code);font-size:34px}.costs{font-size:42px}.costs td{padding-top:30px;padding-bottom:30px}.lead{font-size:38px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Where the skill stands</div>
  <h2 class="scene-title">What the routine costs</h2>
  <div class="stage">
<table class="data-table full costs">
    <thead><tr><th></th><th class="num">trials</th><th class="num">AIU</th><th class="num">about</th></tr></thead>
    <tbody>
      <tr><td><span data-concept="cq" data-rep="cell">quick suite</span></td><td class="num">10</td><td class="num">24.42</td><td class="num">$0.24 an edit</td></tr>
      <tr><td><span data-concept="cf" data-rep="cell">full suite</span></td><td class="num">30</td><td class="num">66.57</td><td class="num">$0.67 · plus 6 judge calls</td></tr>
    </tbody>
  </table>
  <p class="lead"><span data-concept="tok" data-rep="note">largest quick trial: 90,935 tokens · budget 215,000</span></p>
  <p class="note">our run · $0.01 per AIU</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "cq",
  "at": "1",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "cf",
  "at": "2",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "tok",
  "at": "3",
  "color": "blue"
 }
]
</script>
</body>
</html>

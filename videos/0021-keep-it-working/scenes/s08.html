<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>One option runs a suite</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.code.dark.cmd{min-width:1000px;font-size:40px;line-height:1.55}.callout{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Tags, suites and exit codes</div>
  <h2 class="scene-title">One option runs a suite</h2>
  <div class="stage">
<div class="annotated">
    <pre class="code dark cmd" data-lang="bash"><code><span style="color:#4EA5E6">vally</span><span style="color:#B3C0BF"> </span><span style="color:#3CC0B3">eval</span><span style="color:#B3C0BF"> </span><span data-concept="suite" data-rep="code"><span style="color:#F0733F">--suite</span><span style="color:#B3C0BF"> </span><span style="color:#3CC0B3">quick</span></span><span style="color:#B3C0BF"> </span><span style="color:#F0733F">\</span>
<span style="color:#B3C0BF">  </span><span data-concept="rest" data-rep="code"><span style="color:#F0733F">--model</span><span style="color:#B3C0BF"> </span><span style="color:#3CC0B3">claude-haiku-4.5,gpt-5.6-terra</span></span><span style="color:#B3C0BF"> </span><span style="color:#F0733F">\</span>
<span style="color:#B3C0BF">  </span><span style="color:#F0733F">--workers</span><span style="color:#B3C0BF"> </span><span style="color:#EA6AA6">2</span></code></pre>
    <aside class="callouts"><p class="callout" data-anchor="suite">in place of -e and a file</p><p class="callout" data-anchor="rest">everything else as before</p></aside>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "suite",
  "at": "0~dash dash suite",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "rest",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "2"
 }
]
</script>
</body>
</html>

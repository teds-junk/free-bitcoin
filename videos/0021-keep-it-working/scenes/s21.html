<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>From one pair to two suites</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:260px}.terms .label{font-size:34px}.terms .title{font-size:48px}.terms .semantic-block{min-height:300px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Where the skill stands</div>
  <h2 class="scene-title">From one pair to two suites</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="w1" data-rep="block" data-role="structure">
      <div class="title words">At the start</div><div class="label">a first draft, and a tick that hid a made-up number</div>
    </div>
    <div class="semantic-block" data-concept="w2" data-rep="block" data-role="attention">
      <div class="title">1 of 6</div><div class="label">pairs of stimulus and model passed, with our first graders</div>
    </div>
    <div class="semantic-block" data-concept="w3" data-rep="block" data-role="success">
      <div class="title">15 of 15</div><div class="label">stimuli passed on each model, in the full suite: four eval files, budgets, a judge</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "w1",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "w2",
  "at": "2",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "w3",
  "at": "3",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "4"
 }
]
</script>
</body>
</html>

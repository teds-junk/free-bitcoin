<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Three checks for one-off questions</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:260px}.terms .label{font-size:34px}.terms .title{font-size:40px;line-height:1.25}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Cheapest check first</div>
  <h2 class="scene-title">Three checks for one-off questions</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="o1" data-rep="block" data-role="structure">
      <div class="title words">With and without the skill</div><div class="label">after a large rewrite</div>
    </div>
    <div class="semantic-block" data-concept="o2" data-rep="block" data-role="structure">
      <div class="title words">Before and after, then <span class="mono">vally compare</span></div><div class="label">did an edit help, or hurt?</div>
    </div>
    <div class="semantic-block" data-concept="o3" data-rep="block" data-role="structure">
      <div class="title words">Cost per passing trial</div><div class="label">before changing model or effort</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "o1",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "o2",
  "at": "2",
  "color": "blue"

</script>
</body>
</html>

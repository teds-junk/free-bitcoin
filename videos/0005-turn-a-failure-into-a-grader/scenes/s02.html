<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grade the result, not the route</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Three habits for graders</div>
  <h2 class="scene-title">Grade the result, not the route</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="route" data-rep="block" data-role="structure">
      <div class="title words">The route</div><div class="label">open the file or search it · one edit or two</div>
    </div>
    <div class="semantic-block" data-concept="result" data-rep="block" data-role="attention">
      <div class="title words">The result</div><div class="label">what the agent left behind: the patch</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "route",
  "at": "2~routes",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "result",
  "at": "4~left behind",
  "color": "yellow"
 }
]
</script>
</body>
</html>

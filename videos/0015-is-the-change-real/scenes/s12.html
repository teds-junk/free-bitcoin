<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What will nine trials show?</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.counts{font-size:44px}.counts th{font-size:32px}.counts td{padding-top:26px;padding-bottom:26px}.counts td.mono{font-family:var(--font-code);font-size:38px;white-space:nowrap}.counts td.num{font-family:var(--font-code)}.lead{font-size:40px;margin:0}.stage{gap:36px}.counts td{height:96px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Compare before and after</div>
  <h2 class="scene-title">What will nine trials show?</h2>
  <div class="stage">
<table class="data-table full counts">
    <thead><tr><th>trials passed</th><th class="num">before the edit</th><th class="num">after the edit</th></tr></thead>
    <tbody>
      <tr><td class="mono">claude-haiku-4.5</td><td class="num"></td><td class="num"></td></tr>
      <tr><td class="mono">gpt-5.6-terra</td><td class="num"></td><td class="num"></td></tr>
    </tbody>
  </table>
  <p class="lead"><span data-concept="nine" data-rep="note">3 stimuli × 3 trials = 9 trials for each variant</span></p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "nine",
  "at": "0",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "1"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>First, trust the grader</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.order .semantic-block{min-height:300px}.order .title{font-size:52px;line-height:1.2}.order .label{font-size:36px}.lead{font-size:38px;margin:0}.stage{gap:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">The earlier fixes, re-examined</div>
  <h2 class="scene-title">First, trust the grader</h2>
  <div class="stage">
<div class="cols wide order">
    <div class="semantic-block" data-concept="g1" data-rep="block" data-role="attention">
      <div class="step">1</div><div class="title words">Test the grader</div><div class="label">the oracle, then saved trials</div>
    </div>
    <div class="semantic-block" data-concept="g2" data-rep="block" data-role="structure">
      <div class="step">2</div><div class="title words">Work out the range</div><div class="label">count trials, then the calculator</div>
    </div>
  </div>
  <p class="lead"><span data-concept="wrong" data-rep="note">A range around a wrong grader’s count measures the wrong thing, carefully.</span></p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "g1",
  "at": "0~the grader",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "wrong",
  "at": "1",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "g1",
  "at": "2~test the graders",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "g2",
  "at": "2~only then",
  "color": "blue"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Certainty costs trials</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.ranges{display:grid;grid-template-columns:max-content 1fr max-content;gap:14px 28px;align-items:center;width:100%}.ranges .rl{font:500 34px/1.2 var(--font-code);color:var(--ink);white-space:nowrap}.ranges .rt{font:400 32px/1.2 var(--font-body);color:var(--ink-soft);white-space:nowrap}.ranges .track{position:relative;height:46px;background:var(--paper-muted);border-radius:var(--radius)}.ranges .fill{position:absolute;top:0;bottom:0;border-radius:var(--radius)}.ranges .fill.before{background:var(--focus-blue)}.ranges .fill.after{background:var(--focus-yellow)}.ranges .at{position:absolute;top:7px;bottom:7px;width:6px;margin-left:-3px;border-radius:3px;background:var(--ink)}.ranges .axis{grid-column:2;display:flex;justify-content:space-between;font:400 26px/1 var(--font-body);color:var(--ink-muted)}.ranges .group{grid-column:1 / -1;font:600 28px/1.2 var(--font-body);color:var(--ink-soft);margin-top:10px}.ranges{gap:18px 32px}.ranges .track{height:54px}.ranges .rl{font-size:38px}.ranges .rt{font-size:34px}.ranges .group{font-size:30px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What a small sample can show</div>
  <h2 class="scene-title">Certainty costs trials</h2>
  <div class="stage">
<div class="ranges">
      <div class="group">the same 70% pass rate, with four times the trials each time</div>
      <div class="rl"><span data-concept="t1" data-rep="cell">7 of 10</span></div>
      <div class="track"><div class="fill before" style="left:39.7%;width:49.5%"></div><div class="at" style="left:70.0%"></div></div>
      <div class="rt">40% to 89% · 49 points wide</div>
      <div class="rl"><span data-concept="t2" data-rep="cell">28 of 40</span></div>
      <div class="track"><div class="fill before" style="left:54.6%;width:27.4%"></div><div class="at" style="left:70.0%"></div></div>
      <div class="rt">55% to 82% · 27 points wide</div>
      <div class="rl"><span data-concept="t3" data-rep="cell">112 of 160</span></div>
      <div class="track"><div class="fill before" style="left:62.5%;width:14.1%"></div><div class="at" style="left:70.0%"></div></div>
      <div class="rt">62% to 77% · 15 points wide</div>
      <div class="axis"><span>0%</span><span>50%</span><span>100%</span></div>
    </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "t1",
  "at": "0",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "t2",
  "at": "0~four times",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "t3",
  "at": "0~halve",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "1"
 }
]
</script>
</body>
</html>

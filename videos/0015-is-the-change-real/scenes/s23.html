<!doctype html>

  <style>#steps{width:100%;padding:36px 40px 44px;gap:24px}#steps .parts{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;width:100%}#steps .part{min-height:300px}#steps .part .title{font-size:46px;line-height:1.2}#steps .part .label{font-size:30px}</style>

      <div class="step">4</div><div class="title">Say what it supports</div><div class="label">overlap: these trials cannot tell</div></div></div>
  </div>
  </div>

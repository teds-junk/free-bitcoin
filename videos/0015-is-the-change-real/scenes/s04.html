<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Three habits for small counts</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.habits .semantic-block{min-height:360px}.habits .title{font-size:44px;line-height:1.2}.habits .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What a small sample can show</div>
  <h2 class="scene-title">Three habits for small counts</h2>
  <div class="stage">
<div class="cols habits">
    <div class="semantic-block" data-concept="h1" data-rep="block" data-role="structure">
      <div class="step">1</div><div class="title words">Like with like</div><div class="label">same stimuli, graders and model, in one sitting</div>
    </div>
    <div class="semantic-block" data-concept="h2" data-rep="block" data-role="transform">
      <div class="step">2</div><div class="title words">Counts, not percentages</div><div class="label">100% is 3 of 3, or 300 of 300</div>
    </div>
    <div class="semantic-block" data-concept="h3" data-rep="block" data-role="attention">
      <div class="step">3</div><div class="title words">“These trials cannot tell”</div><div class="label">when the ranges overlap</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "h1",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "h2",
  "at": "2",
  "color": "cyan"
 },
 {
  "type": "focus",
  "target": "h3",
  "at": "3",
  "color": "yellow"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What does a command get back?</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>#sim{width:100%;padding:36px 40px 44px;gap:24px}#sim .parts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;width:100%}#sim .part{min-height:300px}#sim .part .title{font-size:50px;line-height:1.2}#sim .part .label{font-size:32px}</style>
</head>
<body>
<main class="scene layout-expand">
  <div class="eyebrow">Recap</div>
  <h2 class="scene-title">What does a command get back?</h2>
  <div class="stage">
<div class="semantic-block" id="sim" data-role="structure">
    <div class="title words">under a simulation</div>
    <div class="parts"><div class="part" data-concept="p1" data-rep="part">
      <div class="title words">It matches a pattern</div><div class="label">it doesn’t run: the agent gets our output</div></div><div class="part" data-concept="p2" data-rep="part">
      <div class="title words">It matches nothing</div><div class="label">it runs for real, unless there’s a default</div></div><div class="part" data-concept="p3" data-rep="part">
      <div class="title words">A file is not a call</div><div class="label">the answer has to be out of the workspace</div></div></div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "expand",
  "target": "#sim",
  "at": "1"
 },
 {
  "type": "focus",
  "target": "p1",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "p2",
  "at": "2",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "p3",
  "at": "3",
  "color": "yellow"
 }
]
</script>
</body>
</html>

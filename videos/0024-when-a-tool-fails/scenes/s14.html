<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Start from a real session</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.code.dark.rec{font-size:44px;line-height:1.55;min-width:900px}.callout{font-size:34px}.stage{gap:30px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Recording a simulation</div>
  <h2 class="scene-title">Start from a real session</h2>
  <div class="stage">
<div class="annotated">
    <pre class="code dark rec" data-lang="bash"><code><span data-concept="cmd" data-rep="code"><span style="color:#4EA5E6">vally</span><span style="color:#B3C0BF"> </span><span style="color:#3CC0B3">simulate</span><span style="color:#B3C0BF"> </span><span style="color:#3CC0B3">record</span></span><span style="color:#B3C0BF"> </span><span style="color:#F0733F">\</span>
<span style="color:#B3C0BF">  </span><span data-concept="arg" data-rep="code"><span style="color:#A4BA1E">&lt;</span><span style="color:#3CC0B3">run</span><span style="color:#B3C0BF"> </span><span style="color:#3CC0B3">folde</span><span style="color:#B3C0BF">r</span><span style="color:#A4BA1E">&gt;</span></span></code></pre>
    <aside class="callouts"><p class="callout" data-anchor="cmd">prints a simulation block</p><p class="callout" data-anchor="arg">a run folder, or one trajectory file</p></aside>
  </div>
  <p class="note">one pattern for each shell call the trials made, with the output that call really got</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "arg",
  "at": "2~a run folder",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "cmd",
  "at": "2~prints",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "3"
 }
]
</script>
</body>
</html>

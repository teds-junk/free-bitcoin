<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Good behaviour on a bad day</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Test the bad day</div>
  <h2 class="scene-title">Good behaviour on a bad day</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="b1" data-rep="block" data-role="structure">
      <div class="title words">Write no entry</div><div class="label">without the list, an entry is a guess</div>
    </div>
    <div class="semantic-block" data-concept="b2" data-rep="block" data-role="structure">
      <div class="title words">Say what went wrong</div><div class="label">so someone can try again later</div>
    </div>
    <div class="semantic-block" data-concept="b3" data-rep="block" data-role="structure">
      <div class="title words">Stop retrying</div><div class="label">two retries at most; ten are a loop</div>
    </div>
  </div>
  </div>
</main>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Oracle, saved run, then agents</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.steps .semantic-block{min-height:330px}.steps .label{font-size:32px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">A habit for every grader</div>
  <h2 class="scene-title">Oracle, saved run, then agents</h2>
  <div class="stage">
<div class="cols steps">
    <div class="semantic-block" data-concept="h1" data-rep="block" data-role="structure">
      <div class="step">1</div><div class="title words">oracle</div><div class="label">a correct answer, and an untouched file · free</div>
    </div>
    <div class="semantic-block" data-concept="h2" data-rep="block" data-role="attention">
      <div class="step">2</div><div class="title words">re-grade</div><div class="label">a saved run where the failure is known to occur · free</div>
    </div>
    <div class="semantic-block" data-concept="h3" data-rep="block" data-role="change">
      <div class="step">3</div><div class="title words">agent runs</div><div class="label">only then · paid</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "h1",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "h2",
  "at": "2",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "h3",
  "at": "3",
  "color": "orange"
 }
]
</script>
</body>
</html>

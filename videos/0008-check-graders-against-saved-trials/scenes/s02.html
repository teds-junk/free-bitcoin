<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Every saved trial has an answer</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Saved trials are tests</div>
  <h2 class="scene-title">Every saved trial has an answer</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="bad" data-rep="block" data-role="attention">
      <div class="title words">A trial you know is bad</div><div class="label">tests a grader that checks for absence: the grader must fail it</div>
    </div>
    <div class="semantic-block" data-concept="good" data-rep="block" data-role="structure">
      <div class="title words">A trial you know is good, worded differently</div><div class="label">tests whether a grader is too strict</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "bad",
  "at": "3",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "good",
  "at": "4",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "6~wording"
 }
]
</script>
</body>
</html>

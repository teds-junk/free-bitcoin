<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The same run settled another</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.lists{display:flex;flex-direction:column;width:100%}.lists .card > .code.dark{font-size:30px;line-height:1.5;padding:18px 28px}.lists .card .who{font-size:30px}.terms .semantic-block{min-height:190px;justify-content:center}.terms .title{font-size:84px;line-height:1.1}.terms .label{font-size:34px}.stage{gap:28px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">A habit for every grader</div>
  <h2 class="scene-title">The same run settled another</h2>
  <div class="stage">
<div class="lists">
    <div class="card" data-concept="rblock" data-rep="card">
        <div class="who">the first re-grade · one of the six <span class="mono">refactor</span> blocks</div>
        <pre class="code dark" data-lang="text"><code><span>━━━ refactor ━━━</span>
<span>❌ refactor (0/1 graders passed, 1 failed)</span>
<span>  ✗ [</span><span data-concept="an" data-rep="code"><span>adds-nothing</span></span><span>] Workspace diff is not empty — the stimulus changed the workspace</span></code></pre>
      </div>
  </div>
  <div class="cols wide terms">
    <div class="semantic-block" data-concept="six" data-rep="block" data-role="attention">
      <div class="title">6 of 6</div><div class="label"><span class="mono">refactor</span> trials that <span class="mono">adds-nothing</span> failed</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "an",
  "at": "1~Adds nothing",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "six",
  "at": "1~all six",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "2"
 }
]
</script>
</body>
</html>

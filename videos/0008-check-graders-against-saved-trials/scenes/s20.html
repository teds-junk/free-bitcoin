<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What tests a must-not grader?</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>#kind{width:100%;padding:36px 40px 44px;gap:24px}#kind .parts{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;width:100%}#kind .part{min-height:280px}#kind .part .title{font-size:52px;line-height:1.2}#kind .part .label{font-size:32px}</style>
</head>
<body>
<main class="scene layout-expand">
  <div class="eyebrow">Recap</div>
  <h2 class="scene-title">What tests a must-not grader?</h2>
  <div class="stage">
<div class="semantic-block" id="kind" data-role="structure">
    <div class="title words">a grader that checks for absence</div>
    <div class="parts"><div class="part" data-concept="p1" data-rep="part">
      <div class="title words">the oracle</div><div class="label">an untouched file passes it honestly, so it is marked N/A</div></div><div class="part" data-concept="p2" data-rep="part">
      <div class="title words">a saved bad trial</div><div class="label">in a re-grade, the grader must fail it</div></div></div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "expand",
  "target": "#kind",
  "at": "1"
 },
 {
  "type": "focus",
  "target": "p1",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "p2",
  "at": "2",
  "color": "yellow"
 }
]
</script>
</body>
</html>

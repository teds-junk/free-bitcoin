<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Four files, one fault each</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.data-table{font-size:40px}.data-table th{font-size:30px}.data-table td{padding-top:28px;padding-bottom:28px;height:56px}.data-table td.mono{font-family:var(--font-code);font-size:34px;white-space:nowrap}.four th:nth-child(2){width:44%}.four th:nth-child(3){width:30%}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">An eval that never starts an agent</div>
  <h2 class="scene-title">Four files, one fault each</h2>
  <div class="stage">
<table class="data-table full four">
    <thead><tr><th><span class="mono">evals/broken/</span></th><th>Fault</th><th><span data-concept="proof" data-rep="cell">Proof of the fix</span></th></tr></thead>
    <tbody>
<tr><td class="mono"><span data-concept="files" data-rep="cell">merged-list.eval.yaml</span></td><td></td><td></td></tr>
<tr><td class="mono"><span data-concept="files" data-rep="cell">quick.eval.yaml</span></td><td></td><td></td></tr>
<tr><td class="mono"><span data-concept="files" data-rep="cell">entry.eval.yaml</span></td><td></td><td></td></tr>
<tr><td class="mono"><span data-concept="files" data-rep="cell">judged.eval.yaml</span></td><td></td><td></td></tr>
    </tbody>
  </table>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "files",
  "at": "1~four eval files",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "proof",
  "at": "4",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "5"
 }
]
</script>
</body>
</html>

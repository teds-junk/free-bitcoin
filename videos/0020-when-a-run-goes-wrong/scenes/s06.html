<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Commands run before the agent</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.annotated .code.dark{font-size:40px;line-height:1.5;padding:30px 38px}.callout{font-size:34px}.code.dark.cmds{min-width:820px}.stage{gap:30px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Where each answer lives</div>
  <h2 class="scene-title">Commands run before the agent</h2>
  <div class="stage">
<div class="annotated">
    <pre class="code dark cmds" data-lang="yaml"><code><span style="color:#4EA5E6">agent_environment</span><span style="color:#B3C0BF">:</span>
<span style="color:#B3C0BF">  </span><span data-concept="c" data-rep="code"><span style="color:#4EA5E6">commands</span><span style="color:#B3C0BF">:</span></span>
<span style="color:#B3C0BF">    - </span><span data-concept="e" data-rep="code"><span style="color:#3CC0B3">echo hello &gt; note.txt</span></span></code></pre>
    <aside class="callouts"><p class="callout" data-anchor="c">after the files are copied, before the agent starts</p><p class="callout" data-anchor="e">one command per entry, as a string</p></aside>
  </div>
  <p class="note"><span data-concept="state" data-rep="cell">what the commands create is starting state: it is not in the trial’s diff</span></p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "c",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "e",
  "at": "2",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "state",
  "at": "3",
  "color": "blue"
 }
]
</script>
</body>
</html>

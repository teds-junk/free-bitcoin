<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two looked like verdicts</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">A symptom table to keep</div>
  <h2 class="scene-title">Two looked like verdicts</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="v1" data-rep="block" data-role="attention">
      <div class="title">FAIL</div><div class="label">from a grader that could not pass</div>
    </div>
    <div class="semantic-block" data-concept="v2" data-rep="block" data-role="attention">
      <div class="title">score 0</div><div class="label">from a judge call that failed</div>
    </div>
  </div>
  <p class="lead"><span data-concept="order" data-rep="cell">valid, then complete, then the verdict</span></p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "v1",
  "at": "3",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "v2",
  "at": "4",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "order",
  "at": "5",
  "color": "blue"
 }
]
</script>
</body>
</html>

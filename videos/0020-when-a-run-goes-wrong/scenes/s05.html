<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lint checks the shape</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:300px}.terms .label{font-size:34px}.terms .title{font-size:48px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Where each answer lives</div>
  <h2 class="scene-title">Lint checks the shape</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="can" data-rep="block" data-role="structure">
      <div class="title words">Lint can see</div><div class="label">unknown field names · files that don’t exist · values of the wrong kind</div>
    </div>
    <div class="semantic-block" data-concept="cannot" data-rep="block" data-role="attention">
      <div class="title words">Lint can’t see</div><div class="label">what a value means to the program that uses it</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "can",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "cannot",
  "at": "3",
  "color": "yellow"
 }
]
</script>
</body>
</html>

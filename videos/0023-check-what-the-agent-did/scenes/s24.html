<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A new question for the team</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:200px}.terms .label{font-size:34px}.terms .title{font-size:42px;line-height:1.2}.stage{gap:30px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What the path showed</div>
  <h2 class="scene-title">A new question for the team</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="q1" data-rep="block" data-role="structure">
      <div class="title words">Does the skill write good entries?</div><div class="label">measured earlier</div>
    </div>
    <div class="semantic-block" data-concept="q2" data-rep="block" data-role="attention">
      <div class="title words">Does the app get the skill used?</div><div class="label">new</div>
    </div>
  </div>
  <div class="quote" data-concept="prompt" data-rep="quote"><span class="who">The app’s prompt</span><p>“Write the Unreleased changelog entries for every change listed in release/merged.txt.”</p></div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "q1",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "q2",
  "at": "2",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "prompt",
  "at": "2~prompt",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "4"
 }
]
</script>
</body>
</html>

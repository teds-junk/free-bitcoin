<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A second grader, for retries</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Catching loops</div>
  <h2 class="scene-title">A second grader, for retries</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="mr" data-rep="block" data-role="structure">
      <div class="title"><span class="mono">max-repeat</span></div><div class="label">the same action, back to back, more than max times</div>
    </div>
    <div class="semantic-block" data-concept="lo" data-rep="block" data-role="attention">
      <div class="title"><span class="mono">loop-outcome</span></div><div class="label">did it loop, and was that expected?</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "lo",
  "at": "0",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "mr",
  "at": "1~max repeat",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "lo",
  "at": "1~loop outcome",
  "color": "yellow"
 }
]
</script>
</body>
</html>

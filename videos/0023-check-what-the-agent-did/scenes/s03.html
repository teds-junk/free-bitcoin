<html lang="en">

<body>
<main class="scene ">

    <div class="semantic-block" data-concept="req" data-rep="block" data-role="structure">
      <div class="title words">Required</div><div class="label">the agent works from the list</div>

      <div class="title words">Too long</div><div class="label">the same call, again and again</div>
    </div>
  </div>
  </div>

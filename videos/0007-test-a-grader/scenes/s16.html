<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Golden patches for the rest</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.code.dark.tree{min-width:760px;font-size:38px;line-height:1.6}.callout{font-size:34px}.lead{font-size:38px;margin:0}.stage{gap:36px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Prove the graders</div>
  <h2 class="scene-title">Golden patches for the rest</h2>
  <div class="stage">
<div class="annotated">
    <pre class="code dark tree" data-lang="text"><code><span>evals/golden/</span>
<span>  typo-fix.patch</span>
<span>  </span><span data-concept="new" data-rep="code"><span>security.patch</span></span>
<span>  </span><span data-concept="new" data-rep="code"><span>two-changes.patch</span></span>
<span>  </span><span data-concept="new" data-rep="code"><span>after-release.patch</span></span></code></pre>
    <aside class="callouts"><p class="callout" data-anchor="new">each from a trial we read and judged correct</p></aside>
  </div>
  <p class="lead"><span data-concept="ref" data-rep="note"><span class="mono">refactor</span> has none: its correct answer changes nothing</span></p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "new",
  "at": "1",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "ref",
  "at": "3",
  "color": "yellow"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>One correct answer each</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What the oracle didn’t test</div>
  <h2 class="scene-title">One correct answer each</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="tried" data-rep="block" data-role="success">
      <div class="title words">Tried</div><div class="label">the one correct answer we chose</div>
    </div>
    <div class="semantic-block" data-concept="not" data-rep="block" data-role="attention">
      <div class="title words">Not tried</div><div class="label">another correct answer, worded differently</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "tried",
  "at": "1",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "not",
  "at": "2",
  "color": "yellow"
 }
]
</script>
</body>
</html>

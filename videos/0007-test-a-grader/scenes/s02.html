<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two ways to be wrong</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Who grades the grader?</div>
  <h2 class="scene-title">Two ways to be wrong</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="fails" data-rep="block" data-role="failure">
      <div class="title words">It fails correct work</div><div class="label">we chase a problem that isn’t there</div>
    </div>
    <div class="semantic-block" data-concept="passes" data-rep="block" data-role="attention">
      <div class="title words">It passes work that wasn’t done</div><div class="label">we stop looking at a problem that is</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "fails",
  "at": "2",
  "color": "red"
 },
 {
  "type": "focus",
  "target": "passes",
  "at": "4",
  "color": "yellow"
 }
]
</script>
</body>
</html>

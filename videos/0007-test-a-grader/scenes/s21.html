<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What are the oracle’s two tests?</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>#tests{width:100%;padding:36px 40px 44px;gap:24px}#tests .parts{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;width:100%}#tests .part{min-height:280px}#tests .part .title{font-size:46px;line-height:1.2}#tests .part .label{font-size:32px}</style>
</head>
<body>
<main class="scene layout-expand">
  <div class="eyebrow">Recap</div>
  <h2 class="scene-title">What are the oracle’s two tests?</h2>
  <div class="stage">
<div class="semantic-block" id="tests" data-role="structure">
    <div class="title">vally oracle</div>
    <div class="parts"><div class="part" data-concept="p1" data-rep="part">
      <div class="title">with the golden patch</div><div class="label">plays an agent that got everything right · a healthy grader passes</div></div><div class="part" data-concept="p2" data-rep="part">
      <div class="title">--no-golden-input</div><div class="label">plays an agent that did nothing · a healthy grader fails</div></div></div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "expand",
  "target": "#tests",
  "at": "1"
 },
 {
  "type": "focus",
  "target": "p1",
  "at": "1",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "p2",
  "at": "2",
  "color": "yellow"
 }
]
</script>
</body>
</html>

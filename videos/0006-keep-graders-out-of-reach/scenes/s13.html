<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Look inside, then hide a script</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}.terms .title{font-size:40px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">A script the agent never sees</div>
  <h2 class="scene-title">Look inside, then hide a script</h2>
  <div class="stage">
<div class="cols terms">
    <div class="semantic-block" data-concept="p1" data-rep="block" data-role="structure">
      <div class="step">1</div><div class="title words">Keep one workspace</div><div class="label">and list its files</div>
    </div>
    <div class="semantic-block" data-concept="p2" data-rep="block" data-role="transform">
      <div class="step">2</div><div class="title words">Add the two stimuli</div><div class="label">and run all five on both models</div>
    </div>
    <div class="semantic-block" data-concept="p3" data-rep="block" data-role="change">
      <div class="step">3</div><div class="title words">Add a rule to the skill</div><div class="label">and run again</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "p1",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "p2",
  "at": "2",
  "color": "cyan"
 },
 {

  "target": "p3",

  "color": "orange"
 },
 {
  "type": "focus",
  "target": "p1",
  "at": "4",
  "color": "blue"
 }
]
</script>
</body>
</html>

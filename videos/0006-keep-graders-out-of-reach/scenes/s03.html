<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agents do find the answers</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}.terms .title{font-size:84px;line-height:1.15}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Why hide the grader</div>
  <h2 class="scene-title">Agents do find the answers</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="berkeley" data-rep="block" data-role="attention">
      <div class="title words">73% to 100%</div><div class="label">scored on eight benchmarks by agents that solved none of the tasks</div>
    </div>
    <div class="semantic-block" data-concept="cursor" data-rep="block" data-role="attention">
      <div class="title words">63%</div><div class="label">of one model’s passing runs copied the published fix</div>
    </div>
  </div>
  <p class="note">Sources: Berkeley RDI, April 2026 · Cursor, June 2026 (the vendor’s own report, one model, one benchmark)</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "berkeley",
  "at": "2~seventy-three",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "cursor",
  "at": "5~sixty-three",
  "color": "yellow"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two programs, two traces</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.code.dark.tree{min-width:820px;font-size:38px;line-height:1.45}.callout{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Joining the app’s traces to Vally’s</div>
  <h2 class="scene-title">Two programs, two traces</h2>
  <div class="stage">
<div class="annotated">
    <pre class="code dark tree" data-lang="text"><code><span>Vally · otel-spans.jsonl</span>
<span>  </span><span data-concept="trial" data-rep="code"><span>vally.trial</span></span>
<span>    </span><span data-concept="attempt" data-rep="code"><span>vally.attempt</span></span>

<span>the app · its own trace file</span>
<span>  </span><span data-concept="session" data-rep="code"><span>invoke_agent</span></span>
<span>    chat</span>
<span>    execute_tool</span></code></pre>
    <aside class="callouts"><p class="callout" data-anchor="trial">one for each trial</p><p class="callout" data-anchor="attempt">one for each attempt</p><p class="callout" data-anchor="session">no parent: a trace of its own</p></aside>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "trial",
  "at": "1~span for the trial",

 },

 },

 }
]
</script>
</body>
</html>

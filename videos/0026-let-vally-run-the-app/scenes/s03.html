<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two sessions, two sets of settings</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">The executor is the seam</div>
  <h2 class="scene-title">Two sessions, two sets of settings</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="own" data-rep="block" data-role="structure">
      <div class="title">copilot-sdk</div><div class="label">Vally’s own executor · a Copilot SDK session, with Vally’s settings</div>
    </div>
    <div class="semantic-block" data-concept="app" data-rep="block" data-role="attention">
      <div class="title">release-app</div><div class="label">an executor that calls the app · a Copilot SDK session, with the team’s settings</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[

  "type": "focus",
  "target": "own",
  "at": "0",
  "color": "blue"
 },

 },

  "target": "none",

 },

  "type": "focus",

</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Three comparisons, one check</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.data-table{font-size:40px}.data-table th{font-size:30px}.data-table td{padding-top:20px;padding-bottom:20px}.data-table td.mono,.data-table th.mono{font-family:var(--font-code);font-size:32px}.data-table th:last-child,.data-table td:last-child{padding-right:16px}.three td{padding-top:30px;padding-bottom:30px;height:56px}.three{font-size:36px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Compare before and after</div>
  <h2 class="scene-title">Three comparisons, one check</h2>
  <div class="stage">
<table class="data-table full three">
    <thead><tr><th>baseline</th><th>treatment</th><th>check</th><th class="num">mean score [range]</th><th class="num"><span data-concept="exitcol" data-rep="cell">exit code</span></th></tr></thead>
    <tbody>
<tr><td class="mono"><span data-concept="r1" data-rep="cell">haiku-before</span></td><td class="mono"><span data-concept="r1" data-rep="cell">haiku-after</span></td><td>off</td><td class="num"><span data-concept="r1-m" data-rep="cell"></span></td><td class="num"><span data-concept="r1-x" data-rep="cell"></span></td></tr>
<tr><td class="mono"><span data-concept="r2" data-rep="cell">terra-before</span></td><td class="mono"><span data-concept="r2" data-rep="cell">terra-after</span></td><td>on</td><td class="num"><span data-concept="r2-m" data-rep="cell"></span></td><td class="num"><span data-concept="r2-x" data-rep="cell"></span></td></tr>
<tr><td class="mono"><span data-concept="r3" data-rep="cell">haiku-after</span></td><td class="mono"><span data-concept="r3" data-rep="cell">haiku-before</span></td><td>on</td><td class="num"><span data-concept="r3-m" data-rep="cell"></span></td><td class="num"><span data-concept="r3-x" data-rep="cell"></span></td></tr>
    </tbody>
  </table>
  <p class="note">each one judges saved trials of the before-and-after experiment · no agent runs</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "r1",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "r2",
  "at": "2",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "r3",
  "at": "3",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "exitcol",
  "at": "4",
  "color": "yellow"
 }
]
</script>
</body>
</html>

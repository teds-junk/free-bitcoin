<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A verdict becomes a score</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.data-table{font-size:40px}.data-table th{font-size:30px}.data-table td{padding-top:20px;padding-bottom:20px}.data-table td.mono,.data-table th.mono{font-family:var(--font-code);font-size:32px}.data-table th:last-child,.data-table td:last-child{padding-right:16px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What compare reports</div>
  <h2 class="scene-title">A verdict becomes a score</h2>
  <div class="stage">
<table class="data-table full">
    <thead><tr><th>The judge’s verdict on the treatment</th><th class="num">score</th></tr></thead>
    <tbody>
<tr><td><span data-concept="v1" data-rep="cell">much better</span></td><td class="num"><span data-concept="v1" data-rep="cell">+1.0</span></td></tr>
<tr><td><span data-concept="v2" data-rep="cell">slightly better</span></td><td class="num"><span data-concept="v2" data-rep="cell">+0.4</span></td></tr>
<tr><td><span data-concept="v3" data-rep="cell">equal, or the two orders disagree</span></td><td class="num"><span data-concept="v3" data-rep="cell">0</span></td></tr>
<tr><td><span data-concept="v4" data-rep="cell">slightly worse</span></td><td class="num"><span data-concept="v4" data-rep="cell">−0.4</span></td></tr>
<tr><td><span data-concept="v5" data-rep="cell">much worse</span></td><td class="num"><span data-concept="v5" data-rep="cell">−1.0</span></td></tr>
    </tbody>
  </table>
  <p class="note">a pair: the same stimulus and trial number from each version · two judge calls per pair</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "v1",
  "at": "2~much better",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "v2",
  "at": "2~slightly better",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "v3",
  "at": "3",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "v4",
  "at": "4~worse",
  "color": "red"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "5"
 }
]
</script>
</body>
</html>

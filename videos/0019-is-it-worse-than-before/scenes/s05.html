<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two questions, two tools</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px;justify-content:center}.terms .title{font-size:56px}.terms .label{font-size:44px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Is it any worse?</div>
  <h2 class="scene-title">Two questions, two tools</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="graders" data-rep="block" data-role="structure">
      <div class="title words">Graders</div><div class="label">is it right?</div>
    </div>
    <div class="semantic-block" data-concept="pairwise" data-rep="block" data-role="attention">
      <div class="title words">Pairwise judge</div><div class="label">is it worse?</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "pairwise",
  "at": "0",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "graders",
  "at": "2",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "pairwise",
  "at": "3",
  "color": "yellow"
 }
]
</script>
</body>
</html>

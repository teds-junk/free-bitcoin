<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What the agent keeps</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.terms .label{font-size:34px}.lead{font-size:42px;margin:0}.stage{gap:44px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What changes in a conversation</div>
  <h2 class="scene-title">What the agent keeps</h2>
  <div class="stage">
<p class="lead"><span data-concept="turn" data-rep="note">A turn is one request in a conversation.</span></p>
  <div class="cols wide terms">
    <div class="semantic-block" data-concept="ws" data-rep="block" data-role="structure">
      <div class="title words">the workspace</div><div class="label">as the last turn left it</div>
    </div>
    <div class="semantic-block" data-concept="mem" data-rep="block" data-role="attention">
      <div class="title words">its memory</div><div class="label">of what was said in earlier turns</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "turn",
  "at": "1~turn",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "ws",
  "at": "3~workspace",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "mem",
  "at": "4",
  "color": "yellow"
 }
]
</script>
</body>
</html>

<main class="scene ">
  <div class="eyebrow">What changes in a conversation</div>
  <h2 class="scene-title">A script, not a user</h2>

<div class="cols wide terms">
    <div class="semantic-block" data-concept="script" data-rep="block" data-role="structure">
      <div class="title words">A script of requests</div><div class="label">sent in order, whatever the agent replied: this is what Vally sends</div>

    <div class="semantic-block" data-concept="user" data-rep="block" data-role="attention">
      <div class="title words">A user who answers back</div><div class="label">Vally doesn’t play one</div>
    </div>
  </div>
  <p class="note">Source: Vally docs, Writing Eval Specs, “Multi-turn conversations”</p>
  </div>

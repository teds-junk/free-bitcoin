<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Still a real result</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.four{font-size:56px}.four th{font-size:32px;padding-bottom:16px}.four td{padding-top:22px;padding-bottom:22px}.four td:first-child{font-size:38px;padding-right:90px}.four td:first-child{white-space:nowrap;width:300px}.four td.num,.four th.num{width:40%}.four tr.total td{font-size:34px;color:var(--ink-soft)}.four tr.total td.num{font-size:38px}.four tr.rate td{font-size:34px}.four tr.rate td.num{font-size:40px}.four .means{font:400 34px/1.3 var(--font-body);color:var(--ink)}.stage{justify-content:flex-start;gap:30px}.two{display:grid;grid-template-columns:1fr 1fr;gap:70px;width:100%}.two .card .who{font-size:32px}.two .four{font-size:48px;width:100%}.two .four th{font-size:28px}.two .four td{padding:14px 20px 14px 0}.two .four td:first-child{font-size:32px;padding-right:20px;width:190px}.two .four tr.rate td{font-size:30px}.two .four tr.rate td.num{font-size:38px}.stage{justify-content:center}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What twelve labels show</div>
  <h2 class="scene-title">Still a real result</h2>
  <div class="stage">
<div class="two">
    <div class="card" data-concept="ours-t" data-rep="card">
        <div class="who">our judge</div>
        <table class="data-table full four ">
    <thead><tr><th></th><th class="num">Ours: yes</th><th class="num">Ours: no</th></tr></thead>
    <tbody>
      <tr><td>Judge: yes</td><td class="num"><span data-concept="a-yy" data-rep="cell">7</span></td><td class="num"><span data-concept="a-yn" data-rep="cell">1</span></td></tr>
      <tr><td>Judge: no</td><td class="num"><span data-concept="a-ny" data-rep="cell">0</span></td><td class="num"><span data-concept="a-nn" data-rep="cell">4</span></td></tr>
      <tr class="rate"><td>rate</td><td class="num"><span data-concept="a-tpr" data-rep="cell">TPR · 100%</span></td><td class="num"><span data-concept="a-tnr" data-rep="cell">TNR · 80%</span></td></tr>
    </tbody>
  </table>
      </div>
    <div class="card" data-concept="all-t" data-rep="card">
        <div class="who">a judge that passes everything, on the same labels</div>
        <table class="data-table full four ">
    <thead><tr><th></th><th class="num">Ours: yes</th><th class="num">Ours: no</th></tr></thead>
    <tbody>
      <tr><td>Judge: yes</td><td class="num"><span data-concept="b-yy" data-rep="cell">7</span></td><td class="num"><span data-concept="b-yn" data-rep="cell">5</span></td></tr>
      <tr><td>Judge: no</td><td class="num"><span data-concept="b-ny" data-rep="cell">0</span></td><td class="num"><span data-concept="b-nn" data-rep="cell">0</span></td></tr>
      <tr class="rate"><td>rate</td><td class="num"><span data-concept="b-tpr" data-rep="cell">TPR · 100%</span></td><td class="num"><span data-concept="b-tnr" data-rep="cell">TNR · 0%</span></td></tr>
    </tbody>
  </table>
      </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "b-tnr",
  "at": "1~zero",
  "color": "red"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "2"
 },
 {
  "type": "focus",
  "target": "a-tnr",
  "at": "4",
  "color": "yellow"
 }
]
</script>
</body>
</html>

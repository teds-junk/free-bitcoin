<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Every trial, one box</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.four{font-size:56px}.four th{font-size:32px;padding-bottom:16px}.four td{padding-top:22px;padding-bottom:22px}.four td:first-child{font-size:38px;padding-right:90px}.four td:first-child{white-space:nowrap;width:300px}.four td.num,.four th.num{width:40%}.four tr.total td{font-size:34px;color:var(--ink-soft)}.four tr.total td.num{font-size:38px}.four tr.rate td{font-size:34px}.four tr.rate td.num{font-size:40px}.four .means{font:400 34px/1.3 var(--font-body);color:var(--ink)}.stage{justify-content:flex-start;gap:30px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">TPR and TNR</div>
  <h2 class="scene-title">Every trial, one box</h2>
  <div class="stage">
<table class="data-table full four ">
    <thead><tr><th></th><th class="num">Ours: yes</th><th class="num">Ours: no</th></tr></thead>
    <tbody>
      <tr><td>Judge: yes</td><td class="num"><span data-concept="yy" data-rep="cell">11</span></td><td class="num"><span data-concept="yn" data-rep="cell">3</span></td></tr>
      <tr><td>Judge: no</td><td class="num"><span data-concept="ny" data-rep="cell">1</span></td><td class="num"><span data-concept="nn" data-rep="cell">5</span></td></tr>
      <tr class="total"><td>labels</td><td class="num"><span data-concept="tot-yes" data-rep="cell">12</span></td><td class="num"><span data-concept="tot-no" data-rep="cell">8</span></td></tr>
    </tbody>
  </table>
  <p class="note">An invented judge, to show the arithmetic · 20 labelled entries</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "tot-yes",
  "at": "2~twelve yes",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "tot-no",
  "at": "2~eight no",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "yy",
  "at": "3~eleven",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "yn",
  "at": "3~three",
  "color": "red"
 },
 {
  "type": "focus",
  "target": "ny",
  "at": "4~one of",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "nn",
  "at": "4~five",
  "color": "green"
 }
]
</script>
</body>
</html>

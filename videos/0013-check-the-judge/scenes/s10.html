<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Twelve trials, four boxes</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.four{font-size:56px}.four th{font-size:32px;padding-bottom:16px}.four td{padding-top:22px;padding-bottom:22px}.four td:first-child{font-size:38px;padding-right:90px}.four td:first-child{white-space:nowrap;width:300px}.four td.num,.four th.num{width:40%}.four tr.total td{font-size:34px;color:var(--ink-soft)}.four tr.total td.num{font-size:38px}.four tr.rate td{font-size:34px}.four tr.rate td.num{font-size:40px}.four .means{font:400 34px/1.3 var(--font-body);color:var(--ink)}.stage{justify-content:flex-start;gap:30px}.four.empty td{padding-top:44px;padding-bottom:44px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Count, compare, decide</div>
  <h2 class="scene-title">Twelve trials, four boxes</h2>
  <div class="stage">
<table class="data-table full four empty">
    <thead><tr><th></th><th class="num">Ours: yes</th><th class="num">Ours: no</th></tr></thead>
    <tbody>
      <tr><td>Judge: yes</td><td class="num"><span data-concept="yy" data-rep="cell"><span class="means">both say yes</span></span></td><td class="num"><span data-concept="yn" data-rep="cell"><span class="means">a failure slips through</span></span></td></tr>
      <tr><td>Judge: no</td><td class="num"><span data-concept="ny" data-rep="cell"><span class="means">a false alarm</span></span></td><td class="num"><span data-concept="nn" data-rep="cell"><span class="means">both say no</span></span></td></tr>
    </tbody>
  </table>
  <p class="note">our 12 trials · no agent runs, no judge calls</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "yy",
  "at": "1~four boxes",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "nn",
  "at": "1~both rates",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "yn",
  "at": "2~differ",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "3"
 },
 {
  "type": "focus",
  "target": "yn",
  "at": "4~judge said yes",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "5"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two counts, not one</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:220px}.terms .label{font-size:38px}.lead{font-size:40px;margin:0}.stage{gap:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">A judge is measured</div>
  <h2 class="scene-title">Two counts, not one</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="q-yes" data-rep="block" data-role="structure">
      <div class="title words">Of our yes labels</div><div class="label">how many did the judge pass?</div>
    </div>
    <div class="semantic-block" data-concept="q-no" data-rep="block" data-role="structure">
      <div class="title words">Of our no labels</div><div class="label">how many did the judge fail?</div>
    </div>
  </div>
  <p class="lead"><span data-concept="aim" data-rep="note">Aim above 90% on each, from 100 or more labels, for a judge to depend on.</span></p>
  <p class="note">Sources: Husain and Shankar, validate-evaluator skill · AI Evals FAQ (2026)</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "q-yes",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "q-no",
  "at": "2",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "3"
 },
 {
  "type": "focus",
  "target": "aim",
  "at": "5~ninety",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "6"
 }
]
</script>
</body>
</html>

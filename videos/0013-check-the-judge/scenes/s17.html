<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>One entry is 20 points</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.figs .semantic-block{min-height:260px;justify-content:center}.figs .title{font-size:76px;line-height:1.1}.figs .label{font-size:36px}.lead{font-size:38px;margin:0}.stage{gap:40px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What twelve labels show</div>
  <h2 class="scene-title">One entry is 20 points</h2>
  <div class="stage">
<div class="cols wide figs">
    <div class="semantic-block" data-concept="now" data-rep="block" data-role="attention">
      <div class="title">4 of 5 · 80%</div><div class="label">TNR in our run, with its one miss</div>
    </div>
    <div class="semantic-block" data-concept="other" data-rep="block" data-role="success">
      <div class="title">5 of 5 · 100%</div><div class="label">TNR had that one entry gone the other way</div>
    </div>
  </div>
  <p class="lead"><span data-concept="cant" data-rep="note">12 labels can’t tell a judge that’s right 99% of the time from one that’s right 85% of the time.</span></p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "now",
  "at": "2",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "other",
  "at": "3~hundred",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "cant",
  "at": "4",
  "color": "blue"
 }
]
</script>
</body>
</html>

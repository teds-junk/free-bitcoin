<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wrong in two directions</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:260px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">A judge is measured</div>
  <h2 class="scene-title">Wrong in two directions</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="slip" data-rep="block" data-role="failure">
      <div class="title words">Judge says yes · we’d say no</div><div class="label">a failure slips through: the skill looks better than it is</div>
    </div>
    <div class="semantic-block" data-concept="alarm" data-rep="block" data-role="attention">
      <div class="title words">Judge says no · we’d say yes</div><div class="label">a false alarm: we hunt for a problem that isn’t there</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "slip",
  "at": "2",
  "color": "red"
 },
 {
  "type": "focus",
  "target": "alarm",
  "at": "3",
  "color": "yellow"
 }
]
</script>
</body>
</html>

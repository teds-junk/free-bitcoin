<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two rates, two names</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.rates .semantic-block{min-height:300px}.rates .title{font-size:72px}.rates .label.full{font-size:40px;color:var(--ink);font-weight:600}.rates .label{font-size:34px}.lead{font-size:38px;margin:0}.stage{gap:36px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">TPR and TNR</div>
  <h2 class="scene-title">Two rates, two names</h2>
  <div class="stage">
<div class="cols wide rates">
    <div class="semantic-block" data-concept="tpr" data-rep="block" data-role="structure">
      <div class="title">TPR</div><div class="label full">true positive rate</div>
      <div class="label">of the trials we labelled yes, the share the judge also passed</div>
    </div>
    <div class="semantic-block" data-concept="tnr" data-rep="block" data-role="structure">
      <div class="title">TNR</div><div class="label full">true negative rate</div>
      <div class="label">of the trials we labelled no, the share the judge also failed</div>
    </div>
  </div>
  <p class="lead"><span data-concept="pos" data-rep="note">positive is a yes</span> · <span data-concept="neg" data-rep="note">negative is a no</span></p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "tpr",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "pos",
  "at": "2",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "tnr",
  "at": "3",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "neg",
  "at": "4",
  "color": "yellow"
 }
]
</script>
</body>
</html>

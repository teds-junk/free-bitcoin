<body>
<main class="scene ">
  <div class="eyebrow">Why both models passed</div>
  <h2 class="scene-title">A pass means no objection.</h2>

<div class="cols wide terms">

      <div class="title words">This is correct.</div><div class="label">what it doesn’t tell you</div>
    </div>
  </div>
  <p class="lead"><span data-concept="one" data-rep="note">So far: one grader, written before anyone had read a run.</span></p>
  </div>
</main>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>One attempt is a trial.</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px}.names{display:block;margin-bottom:10px;font:500 32px/1.4 var(--font-code);color:var(--ink)}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">What a run leaves behind</div>
  <h2 class="scene-title">One attempt is a trial.</h2>
  <div class="stage">
<div class="cols terms">
    <div class="semantic-block" data-concept="stim" data-rep="block" data-role="structure">
      <div class="title">stimulus</div><div class="label"><span class="names">typo-fix</span>one request and its graders</div>
    </div>
    <div class="semantic-block" data-concept="trial" data-rep="block" data-role="transform">
      <div class="title">trial</div><div class="label"><span class="names">typo-fix</span>on <span class="mono">claude-haiku-4.5</span></div>
    </div>
    <div class="semantic-block" data-concept="trial" data-rep="block" data-role="transform">
      <div class="title">trial</div><div class="label"><span class="names">typo-fix</span>on <span class="mono">gpt-5.6-terra</span></div>
    </div>
  </div>
  <p class="lead"><span data-concept="run" data-rep="note">One run: one <span class="inline-code">vally eval</span> command, and everything it saves.</span></p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "trial",
  "at": "1~a trial",
  "color": "cyan"
 },
 {
  "type": "focus",
  "target": "stim",
  "at": "2~one stimulus",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "trial",
  "at": "2~two trials",
  "color": "cyan"
 },
 {
  "type": "focus",
  "target": "run",
  "at": "3~a run",
  "color": "yellow"
 }
]
</script>
</body>
</html>

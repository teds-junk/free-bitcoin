<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What the tick checked</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.results{display:flex;flex-direction:column;gap:36px;width:100%}.results{gap:48px}.results .card > .code.dark{font-size:40px;padding:30px 36px}.results .card .who{font-size:34px}.s-tick{color:var(--green-ink);font-weight:700}</style>

<body>
<main class="scene ">

  <h1 class="scene-title chapter">What the tick checked</h1>

      </div>
      <div class="card" data-concept="card-b" data-rep="card">

        <pre class="code dark" data-lang="markdown"><code><span>- Fix the help text typo in </span><span style="color:#3CC0B3">`notes add`</span><span> </span><span data-concept="pr42" data-rep="code"><span>(#42)</span></span></code></pre>
      </div>
  </div>
  </div>
</main>

</html>

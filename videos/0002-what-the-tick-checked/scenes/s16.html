<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>From the tick to its evidence.</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:260px}.terms .title{font-family:var(--font-code);font-size:40px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Find it in the files</div>
  <h2 class="scene-title">From the tick to its evidence.</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="tickb" data-rep="block" data-role="success">
      <div class="title">✔ typo-fix</div><div class="label">a tick for each model</div>
    </div>
    <div class="semantic-block" data-concept="folder" data-rep="block" data-role="structure">
      <div class="title">results/lesson-1</div><div class="label">the folder our run was saved in</div>
    </div>
  </div>
  <p class="lead"><span data-concept="free" data-rep="note">No agent starts. Nothing is spent.</span></p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "tickb",
  "at": "0",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "folder",
  "at": "0~results folder",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "free",
  "at": "2",
  "color": "yellow"
 }
]
</script>
</body>
</html>

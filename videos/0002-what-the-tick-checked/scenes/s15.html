<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two trials are not enough.</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.grid{font-size:40px}.grid th{font-size:30px}.grid td{padding-top:34px;padding-bottom:34px}.grid td.mono{font-family:var(--font-code);font-size:34px}.grid td.num{color:var(--ink-muted)}.grid td.seen{color:var(--ink);font-family:var(--font-code);font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Why both models passed</div>
  <h2 class="scene-title">Two trials are not enough.</h2>
  <div class="stage">
<table class="data-table full grid">
    <thead><tr><th></th><th class="num">this request, trial 0</th><th class="num">the next trial</th><th class="num">other requests</th></tr></thead>
    <tbody>
      <tr><td class="mono">claude-haiku-4.5</td><td class="num seen"><span data-concept="seen" data-rep="cell">no number</span></td><td class="num"><span data-concept="again" data-rep="cell">?</span></td><td class="num"><span data-concept="other" data-rep="cell">?</span></td></tr>
      <tr><td class="mono">gpt-5.6-terra</td><td class="num seen"><span data-concept="seen" data-rep="cell">(#42)</span></td><td class="num"><span data-concept="again" data-rep="cell">?</span></td><td class="num"><span data-concept="other" data-rep="cell">?</span></td></tr>
    </tbody>
  </table>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "seen",
  "at": "1~two trials",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "again",
  "at": "2~always",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "other",
  "at": "2~other requests",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "3"
 }
]
</script>
</body>
</html>

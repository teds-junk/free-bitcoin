<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lint checks the file for free.</title>

<body>
<main class="scene ">
  <div class="eyebrow">Read the eval file</div>
  <h2 class="scene-title">Lint checks the file for free.</h2>
  <div class="stage">
<div class="annotated">
    <pre class="code dark" data-lang="bash"><code><span data-concept="cmd" data-rep="code"><span style="color:#4EA5E6">vally</span><span style="color:#B3C0BF"> </span><span style="color:#3CC0B3">lint</span></span><span style="color:#B3C0BF"> </span><span data-concept="e" data-rep="code"><span style="color:#F0733F">-e</span><span style="color:#B3C0BF"> </span><span style="color:#3CC0B3">evals/one-request.eval.yaml</span></span></code></pre>
    <aside class="callouts"><p class="callout" data-anchor="cmd">reports mistakes in an eval file</p></aside>
  </div>
  <p class="lead"><span data-concept="free" data-rep="note">It starts no agent, so it spends nothing.</span></p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "cmd",
  "at": "0~vally lint",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "e",

 },
 {
  "type": "focus",

  "color": "green"
 }
]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Three things the file lacks</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.gaps .semantic-block{min-height:290px}.gaps .title{font-size:40px}.gaps .big{font:500 54px/1.2 var(--font-code);color:var(--ink)}.gaps .label{font-size:30px;line-height:1.4}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">A trajectory from outside</div>
  <h2 class="scene-title">Three things the file lacks</h2>
  <div class="stage">
<div class="cols gaps">
    <div class="semantic-block" data-concept="cost" data-rep="block" data-role="attention">
      <div class="title words">cost</div><div class="big">empty</div><div class="label">explained with the converter</div>
    </div><div class="semantic-block" data-concept="wall" data-rep="block" data-role="attention">
      <div class="title words">wall time</div><div class="big">0</div><div class="label">no start or end time in the file</div>
    </div><div class="semantic-block" data-concept="skill" data-rep="block" data-role="attention">
      <div class="title words">skill loaded</div><div class="big">only as a tool call</div><div class="label">if the agent called its skill tool</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "cost",
  "at": "1",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "wall",
  "at": "2",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "skill",
  "at": "3",
  "color": "yellow"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The same two failures</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.data-table{font-size:40px}.data-table th{font-size:30px}.data-table td{padding-top:20px;padding-bottom:20px}.data-table td.mono,.data-table th.mono{font-family:var(--font-code);font-size:34px}.cmp td{padding-top:18px;padding-bottom:18px}.cmp th.num{max-width:420px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Run the app, convert, grade</div>
  <h2 class="scene-title">The same two failures</h2>
  <div class="stage">
<table class="data-table full cmp">
    <thead><tr><th><span class="mono">claude-haiku-4.5</span> · <span class="mono">since-last-release</span></th><th class="num">The app’s run · 1</th>
      <th class="num">Vally’s own trials · 3</th></tr></thead>
    <tbody>
<tr><td class="mono">every-change-handled</td><td class="num"><span data-concept="appfail" data-rep="cell">failed</span></td><td class="num"><span data-concept="theirs" data-rep="cell">1 of 3</span></td></tr>
<tr><td class="mono">loads-the-skill</td><td class="num"><span data-concept="appfail" data-rep="cell">failed</span></td><td class="num"><span data-concept="theirs" data-rep="cell">1 of 3</span></td></tr>
<tr><td class="mono">reads-the-list</td><td class="num"><span data-concept="appok" data-rep="cell">passed</span></td><td class="num"><span data-concept="theirsok" data-rep="cell">3 of 3</span></td></tr>
<tr><td class="mono">never-commits</td><td class="num"><span data-concept="appok" data-rep="cell">passed</span></td><td class="num"><span data-concept="theirsok" data-rep="cell">3 of 3</span></td></tr>
<tr><td class="mono">no-loop</td><td class="num"><span data-concept="appok" data-rep="cell">passed</span></td><td class="num"><span data-concept="theirsok" data-rep="cell">3 of 3</span></td></tr>
    </tbody>
  </table>
  <p class="note">trials that passed each grader</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "theirs",
  "at": "2",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "appfail",
  "at": "3",
  "color": "red"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "4"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Three possible answers</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.rows{display:flex;flex-direction:column;gap:18px;width:100%}.trow{display:flex;align-items:center;gap:40px;padding:14px 22px;border-radius:10px;width:fit-content}.trow.head{padding-top:0;padding-bottom:0}.boxes{display:flex;gap:18px}.num{width:150px;text-align:center;font:500 30px/1 var(--font-body);color:var(--ink-muted)}.box{display:flex;align-items:center;justify-content:center;width:150px;height:96px;border-radius:8px;border:3px solid var(--ink-muted);font:700 52px/1 var(--font-body);color:var(--ink)}.box.tick{color:var(--green-ink)}.box.cross{color:var(--red-ink)}.trow .word{font:600 44px/1 var(--font-body);color:var(--ink);min-width:400px}.trow .mean{font:400 36px/1.3 var(--font-body);color:var(--ink-soft)}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Does the skill beat no skill?</div>
  <h2 class="scene-title">Three possible answers</h2>
  <div class="stage">
<div class="rows"><div class="trow head"><span class="boxes"><span class="num">without</span><span class="num">with</span></span></div><div class="trow" data-concept="a-helps" data-rep="row">
      <span class="boxes"><span class="box cross">✘</span><span class="box tick">✔</span></span><span class="word">the skill helps</span><span class="mean">fails without it, passes with it</span>
    </div><div class="trow" data-concept="a-same" data-rep="row">
      <span class="boxes"><span class="box tick">✔</span><span class="box tick">✔</span></span><span class="word">no difference</span><span class="mean">the model manages either way</span>
    </div><div class="trow" data-concept="a-hurts" data-rep="row">
      <span class="boxes"><span class="box tick">✔</span><span class="box cross">✘</span></span><span class="word">the skill hurts</span><span class="mean">passes without it, fails with it</span>
    </div></div>
  <p class="note">An illustration: one stimulus on one model, without the skill and with it</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "a-helps",
  "at": "1",
  "color": "green"
 },
 {
  "type": "focus",
  "target": "a-same",
  "at": "2",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "a-hurts",
  "at": "3",
  "color": "red"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "4"
 }
]
</script>
</body>
</html>

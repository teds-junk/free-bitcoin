<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Better with the skill?</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.scene-title.chapter{font-size:116px}.terms .semantic-block{min-height:260px}.terms .label{font-size:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">Vally &amp; Agent Evals</div>
  <h1 class="scene-title chapter">Better with the skill?</h1>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="with" data-rep="block" data-role="structure">
      <div class="title words">With the skill</div><div class="label">measured in every run so far</div>
    </div>
    <div class="semantic-block" data-concept="without" data-rep="block" data-role="attention">
      <div class="title words">With no skill</div><div class="label">never run</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "with",
  "at": "3~earlier versions",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "without",
  "at": "3~no skill",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "4"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The score line gives it away</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.map{font-size:40px;align-self:center}.map td{padding-top:14px;padding-bottom:14px}.map th{font-size:30px}.map th,.map td{padding-right:96px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">A judge on a scale</div>
  <h2 class="scene-title">The score line gives it away</h2>
  <div class="stage">
<table class="data-table map">
    <thead><tr><th class="num">Score line</th><th class="num">The judge’s score</th><th class="num">The judge’s answer</th></tr></thead>
    <tbody>
<tr><td class="num"><span data-concept="m5" data-rep="cell">Score: 100%</span></td><td class="num">1</td>
        <td class="num">5</td></tr>
<tr><td class="num"><span data-concept="m4" data-rep="cell">Score: 87.5%</span></td><td class="num">0.75</td>
        <td class="num">4</td></tr>
<tr><td class="num"><span data-concept="m3" data-rep="cell">Score: 75%</span></td><td class="num">0.5</td>
        <td class="num">3</td></tr>
<tr><td class="num"><span data-concept="m2" data-rep="cell">Score: 62.5%</span></td><td class="num">0.25</td>
        <td class="num">2</td></tr>
<tr><td class="num"><span data-concept="m1" data-rep="cell">Score: 50%</span></td><td class="num">0</td>
        <td class="num">1</td></tr>
    </tbody>
    <caption>when the pull request check passes and scores 1 · half of each</caption>
  </table>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "m5",
  "at": "3~hundred",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "m4",
  "at": "3~eighty-seven",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "m1",
  "at": "3~fifty",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "4"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Where the sources agree</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:220px}.terms .label{font-size:32px}.lead{font-size:42px;margin:0}.stage{gap:40px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">When a score helps</div>
  <h2 class="scene-title">Where the sources agree</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="yesno" data-rep="block" data-role="structure">
      <div class="title words">Yes or no, throughout</div><div class="label">Husain, “Using LLM-as-a-Judge”</div>
    </div>
    <div class="semantic-block" data-concept="range" data-rep="block" data-role="structure">
      <div class="title words">Partial success is a range</div><div class="label">Anthropic, “Demystifying evals for AI agents” (2026)</div>
    </div>
  </div>
  <p class="lead"><span data-concept="both" data-rep="note">Both: a clear line for pass or fail, checked against your own labels.</span></p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "yesno",
  "at": "1~yes-or-no",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "range",
  "at": "1~another",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "both",
  "at": "2",
  "color": "yellow"
 }
]
</script>
</body>
</html>

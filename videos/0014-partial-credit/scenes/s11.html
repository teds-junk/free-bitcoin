<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Five answers, rescaled</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.five{gap:24px}.five .semantic-block{min-height:290px}.five .title{font-size:96px;line-height:1.1}.five .label{font-size:34px;line-height:1.3}.lead{font-size:38px;margin:0}.stage{gap:34px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">A judge on a scale</div>
  <h2 class="scene-title">Five answers, rescaled</h2>
  <div class="stage">
<div class="cols five">
    <div class="semantic-block" data-concept="a1" data-rep="block" data-role="structure">
      <div class="title">1</div><div class="label">0</div>
    </div><div class="semantic-block" data-concept="a2" data-rep="block" data-role="structure">
      <div class="title">2</div><div class="label">0.25</div>
    </div><div class="semantic-block" data-concept="a3" data-rep="block" data-role="structure">
      <div class="title">3</div><div class="label">0.5<br>the default threshold</div>
    </div><div class="semantic-block" data-concept="a4" data-rep="block" data-role="structure">
      <div class="title">4</div><div class="label">0.75<br>our threshold</div>
    </div><div class="semantic-block" data-concept="a5" data-rep="block" data-role="structure">
      <div class="title">5</div><div class="label">1</div>
    </div>
  </div>
  <p class="lead">The judge passes when its score reaches its threshold.</p>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "a1",
  "at": "2~becomes zero",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "a5",
  "at": "2~five",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "none",
  "at": "3"
 },
 {
  "type": "focus",
  "target": "a3",
  "at": "4",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "a4",
  "at": "5",
  "color": "green"
 }
]
</script>
</body>
</html>

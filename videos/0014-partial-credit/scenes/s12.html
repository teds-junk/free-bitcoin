<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two thresholds, two jobs</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:280px;justify-content:center}.terms .label{font-size:36px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">A judge on a scale</div>
  <h2 class="scene-title">Two thresholds, two jobs</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="without" data-rep="block" data-role="structure">
      <div class="title words">no scoring block</div><div class="label">the judge’s own threshold decides: a cross fails the trial</div>
    </div>
    <div class="semantic-block" data-concept="with" data-rep="block" data-role="attention">
      <div class="title words">with a scoring block</div><div class="label">only the judge’s score counts; the block’s threshold decides</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "without",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "with",
  "at": "2",
  "color": "yellow"
 }
]
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A scale shows how far off</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>.terms .semantic-block{min-height:260px;justify-content:center}.terms .label{font-size:38px}</style>
</head>
<body>
<main class="scene ">
  <div class="eyebrow">When a score helps</div>
  <h2 class="scene-title">A scale shows how far off</h2>
  <div class="stage">
<div class="cols wide terms">
    <div class="semantic-block" data-concept="pass" data-rep="block" data-role="structure">
      <div class="title words">Did it pass?</div><div class="label">a yes or no</div>
    </div>
    <div class="semantic-block" data-concept="far" data-rep="block" data-role="attention">
      <div class="title words">How far off is a failure?</div><div class="label">a scale</div>
    </div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "focus",
  "target": "pass",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "far",
  "at": "3",
  "color": "yellow"
 }
]
</script>
</body>
</html>

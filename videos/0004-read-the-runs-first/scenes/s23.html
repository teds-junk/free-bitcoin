<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What are the four steps?</title>
  <link rel="stylesheet" href="../_theme/theme.css">
  <script src="../_theme/vl-runtime.js" defer></script>
  <style>#steps{width:100%;padding:36px 40px 44px;gap:24px}#steps .parts{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;width:100%}#steps .part{min-height:280px}#steps .part .title{font-size:52px;line-height:1.2}#steps .part .label{font-size:30px}</style>
</head>
<body>
<main class="scene layout-expand">
  <div class="eyebrow">Recap</div>
  <h2 class="scene-title">What are the four steps?</h2>
  <div class="stage">
<div class="semantic-block" id="steps" data-role="structure">
    <div class="title words">error analysis</div>
    <div class="parts"><div class="part" data-concept="p1" data-rep="part">
      <div class="step">1</div><div class="title">Run</div><div class="label">realistic requests</div></div><div class="part" data-concept="p2" data-rep="part">
      <div class="step">2</div><div class="title">Read</div><div class="label">what came back</div></div><div class="part" data-concept="p3" data-rep="part">
      <div class="step">3</div><div class="title">Note</div><div class="label">what is wrong with each</div></div><div class="part" data-concept="p4" data-rep="part">
      <div class="step">4</div><div class="title">Group</div><div class="label">the notes into failure modes</div></div></div>
  </div>
  </div>
</main>
<script type="application/json" id="cues">
[
 {
  "type": "expand",
  "target": "#steps",
  "at": "1"
 },
 {
  "type": "focus",
  "target": "p1",
  "at": "1",
  "color": "blue"
 },
 {
  "type": "focus",
  "target": "p2",
  "at": "2",
  "color": "cyan"
 },
 {
  "type": "focus",
  "target": "p3",
  "at": "3",
  "color": "yellow"
 },
 {
  "type": "focus",
  "target": "p4",
  "at": "4",
  "color": "orange"
 }
]
</script>
</body>
</html>

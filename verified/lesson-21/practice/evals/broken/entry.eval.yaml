name: entry

defaults:
  timeout: 3m

agent_environment:
  skills:
    - ../../skills/changelog-entry
  files:
    - src: ../fixtures/notes-cli/CHANGELOG.md
      dest: CHANGELOG.md

stimuli:
  - name: typo-fix
    prompt: |
      I fixed the typo in the help text for `notes add`
      (it said "tittle"). Put that in the changelog.
    graders:
      - type: diff-contains
        name: adds-an-entry
        config:
          pattern: '(?m)^\+.*notes add'

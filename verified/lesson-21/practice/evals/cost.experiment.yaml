name: cost

evals:
  - changelog.eval.yaml

vary:
  - /defaults/model
  - /defaults/reasoning_effort
  - /defaults/executor
  - /defaults/timeout
  - /defaults/runs

baseline: haiku-low

overrides:
  runs: 3

variants:
  haiku-low:
    overrides:
      model: claude-haiku-5.5
      reasoning_effort: low
  haiku-high:
    overrides:
      model: claude-haiku-5.5
      reasoning_effort: high
  terra-low:
    overrides:
      model: gpt-5.6-terra
      reasoning_effort: low
  terra-high:
    overrides:
      model: gpt-5.6-terra
      reasoning_effort: high
  qwen-local:
    overrides:
      model: qwen3.5:9b
      timeout: 9m
      runs: 1
      executor:
        name: copilot-sdk
        config:
          provider:
            baseUrl: http://localhost:11434/v1

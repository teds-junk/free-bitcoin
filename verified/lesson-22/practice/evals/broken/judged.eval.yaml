name: judged

defaults:
  timeout: 3m
  judge_model: claude-sonnet-5.5

agent_environment:
  skills:
    - ../../skills/changelog-entry
  files:
    - src: ../fixtures/notes-cli/CHANGELOG.md
      dest: CHANGELOG.md

stimuli:
  - name: cache
    prompt: |
      PR 66 is in: I put an LRU cache in front of the tag
      index, so `notes list --tag` no longer rescans
      every file. Much faster on big folders. Add it to
      the changelog.
    rubric:
      - The new changelog entry says what changes for people
        who use the tool, and does not say how it was coded.
    graders:
      - type: prompt
        name: users-words
        config:
          scoring: binary
          prompt: Begin your reason by quoting the new entry.
      - type: diff-contains
        name: cites-66
        config:
          pattern: '(?m)^\+.*\(#66\)'
